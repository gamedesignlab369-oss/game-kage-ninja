    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = `rgba(3,6,14,${0.34 * clamp(t / 0.5, 0, 1) * (1 - clamp((t - 3.5) / 0.5, 0, 1))})`;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const inA = clamp((t - 0.42) / 0.5, 0, 1) * (1 - clamp((t - 3.55) / 0.45, 0, 1));
  if (inA <= 0) return;
  const rise = (1 - inA) * 20 * u;
  const isPet = clearKind === "pet";
  const isChakra = clearKind === "chakra" || clearKind === "storm";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  ctx.globalAlpha = inA * 0.95;
  ctx.fillStyle = "#9fb6d6";
  ctx.font = `${Math.round(12 * u)}px system-ui, sans-serif`;
  ctx.fillText(clearKind === "boss" ? (clearBossName || "ONI SLAIN") : "LEVEL " + curLevel().roman + "  CLEARED", cx, H * 0.17 - rise);

  ctx.globalAlpha = inA;
  ctx.fillStyle = isPet ? "#ffd98a" : "#a8ecff";
  ctx.font = `800 ${Math.round(Math.min(H * 0.075, 30 * u))}px "Shippori Mincho", serif`;
  ctx.fillText((() => { const ce = choiceEnd(progress.level); if (ce) return ce.title; return isPet ? "KITSUNE JOINS YOU" : isChakra ? "CHAKRA AWAKENED" : clearKind === "boss" ? "THE FOX IS WON" : "THE ROAD GOES ON"; })(), cx, H * 0.30 - rise);

  ctx.globalAlpha = inA * 0.5;
  ctx.fillStyle = isPet ? "#ffd98a" : "#a8ecff";
  ctx.fillRect(cx - W * 0.16, H * 0.30 - rise + Math.min(H * 0.075, 30 * u) * 0.62, W * 0.32, 1.6);

  ctx.globalAlpha = inA * 0.88;
  ctx.fillStyle = "rgba(212,230,250,0.92)";
  ctx.font = `${Math.round(12.5 * u)}px system-ui, sans-serif`;
  ctx.fillText((() => { const ce = choiceEnd(progress.level); if (ce) return ce.sub; return isPet ? "A SPIRIT FOX WILL GUARD YOUR BACK" : isChakra ? "TAP THROW TO HURL CHAKRA" : clearKind === "boss" ? "A SPIRIT FOX NOW FOLLOWS YOU" : "SELL LOOTED WEAPONS IN THE SHRINE — BUY FALCON, TIGER-FANG, STORMBOW"; })(), cx, H * 0.39 - rise);

  if (t > 2.3) {
    const pulse = 0.5 + 0.5 * Math.sin(now * 3.4);
    ctx.globalAlpha = clamp((t - 2.3) / 0.4, 0, 1) * (0.4 + pulse * 0.6);
    ctx.fillStyle = "#dcecff";
    ctx.font = `600 ${Math.round(12 * u)}px system-ui, sans-serif`;
    ctx.fillText("TAP TO CONTINUE", cx, H * 0.88);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = "alphabetic";
}

/* ================================================================ score == */
/* Real music streams from uploaded MP3s (see src/README.md § Music). Until a
   key has a url the procedural koto layer carries the game, and if a track
   fails to load we simply stop asking — the game never depends on the network. */
const MUSIC_TRACKS = {};
const Music = {
  a: null, b: null, cur: null, key: null, vol: 0.55, fade: 0, duck: 1, blocked: false, muted: false,
  ensure() {
    if (this.a) return;
    try {
      this.a = new Audio(); this.b = new Audio();
      for (const el of [this.a, this.b]) { el.loop = true; el.preload = "auto"; el.volume = 0; }
    } catch (e) { this.a = this.b = null; }
  },
  play(key) {
    if (!key) { this.stopAll(); return; }
    this.ensure();
    if (!this.a) return;
    const u = musicUrl(key);
    if (!u) { this.stopAll(); return; }
    /* a real track takes over — silence the procedural koto layer */
    try { if (A.mus) A.mus.gain.value = 0; } catch (e) { }
    if (this.key === key && this.cur) return;
    this.key = key;
    const to = this.cur === this.a ? this.b : this.a;
    try {
      to.src = u; to.volume = 0; to.currentTime = 0;
      to.loop = key !== "victory";
      const p = to.play();
      this.blocked = false;
      if (p && p.catch) p.catch(() => { this.blocked = true; });   /* autoplay locked */
    } catch (e) { this.blocked = true; }
    this.cur = to; this.fade = 0;
  },
  /* browsers block audio until the first gesture — retry then */
  retry() {
    if (!this.blocked || !this.cur) return;
    try { const p = this.cur.play(); if (p && p.catch) p.catch(() => { }); this.blocked = false; } catch (e) { }
  },
  stopAll() { this.key = null; if (this.cur) { try { this.cur.pause(); } catch (e) { } this.cur = null; } },
  setVol(v) { this.vol = v; if (this.cur) { try { this.cur.volume = v * this.fade * this.duck * (this.muted ? 0 : 1); } catch (e) { } } },
  /* the speaker chip mutes the whole score, not just the procedural layer */
  setMuted(v) {
    this.muted = !!v;
    if (this.cur) { try { this.cur.volume = this.muted ? 0 : this.vol * this.fade * (this.duck || 1); } catch (e) { } }
    try { if (A.mus) A.mus.gain.value = this.muted ? 0 : (this.cur ? 0 : 0.62 * clamp(SAVE.set.music, 0, 1)); } catch (e) { }
  },
  toggle() { this.setMuted(!this.muted); return this.muted; },
  tick(dt) {
    /* the procedural koto layer is the fallback: fade it away under a real track */
    if (A.ctx && A.mus && !this.muted) {
      const want = this.cur ? 0 : 0.62 * clamp(SAVE.set.music, 0, 1);
      const cur = A.mus.gain.value;
      if (Math.abs(cur - want) > 0.002) A.mus.gain.value = cur + (want - cur) * Math.min(1, dt * 0.7);
    }
    if (!this.cur) return;
    this.fade = Math.min(1, this.fade + dt / 1.4);
    try { this.cur.volume = this.muted ? 0 : this.vol * this.fade * (this.duck || 1); } catch (e) { }
    for (const el of [this.a, this.b]) {
      if (!el || el === this.cur || el.paused) continue;
      try {
        el.volume = Math.max(0, el.volume - dt * this.vol * 0.9);
        if (el.volume <= 0.001) el.pause();
      } catch (e) { }
    }
  },
};
function musicUrl(key) {
  const t = (typeof root !== "undefined" && root.musicTracks) ? root.musicTracks : null;
  let v = null;
  try { v = t ? t[key] : null; } catch (e) { v = null; }
  if (v && typeof v === "object" && "evaluateItem" in v) v = v.evaluateItem;
  if (typeof v === "string") v = v.trim();
  if (typeof v === "string" && /^https?:\/\/\S+\.(mp3|ogg|m4a|wav)$/i.test(v)) return v;
  return MUSIC_TRACKS[key] || null;
}
/* the land's own theme — the boss fight overrides it in startBossFight() */
function levelMusicKey() {
  if (isEndless()) return "endless";
  const L = curLevel();
  if (L.theme === "snow" || L.theme === "oni" || L.theme === "hollow") return "shrine";
  if (L.theme === "ember" || L.theme === "void") return "ember";
  return "field";
}
function menuMusicKey() { return "menu"; }

/* ============================================================== attract == */
/* A live, self-playing run behind the front-end. Damage is off, so it can
   never die; it loops its stretch of world forever. */
const DEMO = { on: false, t: 0, lastX: 0, stuck: 0, jumpPrev: false, jumpHold: 0, slashCd: 0, level: 2, flags: null };
let AUTO = false;      /* playtest auto-pilot */
let GOD = false;       /* ignore all damage (playtest) */
function startDemo() {
  if (DEMO.on) return;
  DEMO.on = true; DEMO.t = 0; DEMO.stuck = 0;
  DEMO.flags = { pet: progress.hasPet, chakra: progress.hasChakra, storm: progress.hasStorm, cleared: progress.cleared };
  DEMO.level = 2;
  progress.hasPet = true; progress.hasChakra = true; progress.hasStorm = true;
  progress.level = DEMO.level;
  clearArsenal();
  applyUpgrades();
  resetWorld(levelStartX());
  state = "title";
  prefsApply();
}
function stopDemo() {
  if (!DEMO.on) return;
  DEMO.on = false;
  const f = DEMO.flags || {};
  progress.hasPet = !!f.pet; progress.hasChakra = !!f.chakra; progress.hasStorm = !!f.storm; progress.cleared = !!f.cleared;
  applyUpgrades();
  /* the demo bot scavenges weapons like anyone else — don't let one leak into
     the player's real run */
  clearArsenal();
}
/* a plain auto-pilot: run right, hop obstacles, cut down anything close.
   Drives the attract-mode demo, and `__kage.auto(true)` for playtesting. */
function autoDrive(dt) {
  const p = P;
  if (!p || p.dead) return false;
  DEMO.t += dt;
  if (DEMO.slashCd > 0) DEMO.slashCd -= dt;
  IN.ix = 1; IN.down = false;
  let jump = false;
  for (let d = 8; d <= 104; d += 12) {
    const g = groundTopAt(p.x + p.w + d);
    if (g === null) { if (d < 60) jump = true; break; }
    if (g < p.y + p.h - 22) { jump = true; break; }
  }
  if (p.wall !== 0 || p.wallSlide) jump = true;
  let haz = null;
  for (const h of hazards) {
    const hx = h.x + (h.w ? h.w / 2 : 0);
    const dx = hx - (p.x + p.w / 2);
    if (dx < -26 || dx > 140) continue;
    haz = h; break;
  }
  if (haz) { jump = true; if (p.onGround && haz.x - p.x < 52) IN.dashP = true; }
  let foe = null;
  for (const e of enemies) { if (!e.dead && e.x > p.x && e.x - p.x < 130) { foe = e; break; } }
  if (foe && foe.y < p.y - 24) jump = true;
  if (foe && foe.x - p.x < 58) jump = true;
  /* pulse the jump button so a blocked bot keeps trying instead of holding it */
  DEMO.jumpHold -= dt;
  if (!jump) DEMO.jumpHold = 0;
  else if (DEMO.jumpHold <= 0) DEMO.jumpHold = 0.2;
  const jnow = jump && DEMO.jumpHold > 0;
  IN.jump = jnow; IN.jumpP = jnow && !DEMO.jumpPrev; DEMO.jumpPrev = jnow;
  const slash = !!(foe && Math.abs(foe.x - p.x) < 62 && DEMO.slashCd <= 0);
  IN.slashP = slash; if (slash) DEMO.slashCd = 0.34;
  IN.throwP = false;
  /* nudge forward if we get wedged — a firm hop even mid-air, so a bot stuck
     against a tall wall or in a pit always works itself free */
  if (Math.abs(p.x - DEMO.lastX) < 2) DEMO.stuck += dt; else { DEMO.stuck = 0; DEMO.lastX = p.x; }
  if (DEMO.stuck > 1.2) { P.vy = Math.min(P.vy, -520); P.x += 10; DEMO.stuck = 0; }
  return true;
}
function updateDemo(dt) {
  if (!autoDrive(dt)) return;
  /* loop the stretch forever — the attract mode never reaches a gate */
  if (P.x > levelEndX() - 460) resetWorld(levelStartX());
  const d = Math.min(dt, 0.05);
  acc += d;
  let steps = 0;
  while (acc >= STEP && steps < 4) { stepWorld(STEP); acc -= STEP; steps++; }
  if (steps >= 4) acc = 0;
  updateCam(dt); genAhead(); cullWorld();
  for (let i = game.popTexts.length - 1; i >= 0; i--) { const t = game.popTexts[i]; t.t += dt; t.y -= 26 * dt; if (t.t > t.life) game.popTexts.splice(i, 1); }
}

}
/* the watcher's disguise: a dead tree at the arena's edge, lantern unlit */
function drawSenseiTree(sx, sy, fade) {
  if (fade <= 0) return;

  ctx.strokeStyle = "#1c0f08"; ctx.lineCap = "round";
  ctx.lineWidth = 9;

  ctx.lineWidth = 4.5;

  ctx.fillStyle = "rgba(0,0,0,0.35)";

/* the watcher himself: straw hat, white beard, lantern staff */
function drawSenseiElder(sx, sy, a) {

function drawSenseiFigure() {
  if (!isDarkLevel()) return;
  if (state !== "play" && state !== "sensei" && state !== "over") return;

      part({ x: sx + rnd(-20, 20), y: sy - rnd(0, 110), vx: rnd(-20, 20), vy: rnd(-70, -20), g: -30, life: 0.7, max: 0.7, r: rnd(1.6, 3.2), color: pick(["#ffe9c4", "#c9b18f", "#9fd6a0"]), t: "dot", fade: 1 });

function drawSenseiScene() {
  if (!sensei) return;
  const t = sensei.t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const u = clamp(Math.min(W, H) / 420, 0.62, 2.0);
  const bar = Math.min(H * 0.09, 54 * u) * clamp(t / 0.8, 0, 1);

  ctx.fillRect(0, H - bar, W, bar);
  if (t < 1.0) return;

  const cw = Math.min(W * 0.86, 560 * u), chh = 92 * u;
  const cx = W / 2, cy = H - bar - chh / 2 - 12 * u;
  ctx.fillStyle = "rgba(6,10,20,0.92)";
  ctx.fillRect(cx - cw / 2, cy - chh / 2, cw, chh);
  ctx.fillStyle = "rgba(224,69,74,0.9)";
  ctx.fillRect(cx - cw / 2, cy - chh / 2, cw, 2.5 * u);
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffd479";
  ctx.font = `700 ${Math.round(10.5 * u)}px system-ui, sans-serif`;
  ctx.fillText("SENSEI — WATCHER OF THE SECRET CLAN", cx - cw / 2 + 12 * u, cy - chh / 2 + 15 * u);
  ctx.fillStyle = "#e8eef8";
  ctx.font = `${Math.round(12.5 * u)}px system-ui, sans-serif`;
  const maxW = cw - 24 * u;
  const words = txt.split(" ");
  const rows = ["", ""];
  let r = 0;
  for (const w of words) {
    const trial = rows[r] ? rows[r] + " " + w : w;
    if (ctx.measureText(trial).width > maxW && rows[r]) {
      r++;
      if (r > 1) { rows[1] += "…"; break; }
      rows[r] = w;
    } else rows[r] = trial;
  }
  ctx.fillText(rows[0], cx - cw / 2 + 12 * u, cy + 2 * u);
  if (rows[1]) ctx.fillText(rows[1], cx - cw / 2 + 12 * u, cy + 19 * u);
  if (sensei.shown >= full.length) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now * 3.4);

}
/* one heartbeat from death — a red pulse you can feel at the edges */
function drawLowHealth() {

/* the land announces itself when you arrive */
function drawLevelCard() {
  if (state !== "play" || DEMO.on || P.dead) return;
  const t = game.levelTime;
  if (!t || t > 3.5) return;
  const a = t < 0.55 ? t / 0.55 : (t > 2.7 ? Math.max(0, (3.5 - t) / 0.8) : 1);

function drawBossIntro() {

/* ------------------------------------------------------------------ loop -- */
let last = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - last) / 1000; last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  now += dt;
  if ((frameNo & 15) === 0 && (Math.abs(cv.clientWidth - W) > 1 || Math.abs(cv.clientHeight - H) > 1)) resize();
  updateInput();
  update(dt);
  render();
}
