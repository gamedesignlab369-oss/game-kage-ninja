  ctx.lineTo(cx + Math.cos(1.25) * 15, cy + Math.sin(1.25) * 15);
  ctx.stroke();
  if (draw > 0.9) { ctx.strokeStyle = "#ffe9a0"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 15, cy); ctx.stroke(); }
}
function drawClubArt(bx, by, ang) {
  const tx = bx + Math.sin(ang) * 40, ty = by + Math.cos(ang) * 40;
  ctx.strokeStyle = "#3b4763"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = "#8e9fbe";
  ctx.beginPath(); ctx.arc(tx, ty, 8, 0, TAU); ctx.fill();
}
/* the yari is rigid, so it always runs down the body's own forward axis; `ext`
   slides it through the hand (-18 coiled back, +54 rammed home) */
function drawSpearArt(gx, gy, ext, wind) {
  const tipX = gx + 74 + ext * 0.6;
  ctx.strokeStyle = "#4a3a26"; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(gx - 40, gy); ctx.lineTo(tipX, gy); ctx.stroke();
  ctx.fillStyle = "#b9c4d6";
  ctx.beginPath(); ctx.moveTo(tipX, gy); ctx.lineTo(tipX - 12, gy - 3.4); ctx.lineTo(tipX - 12, gy + 3.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8e7346"; ctx.fillRect(tipX - 13, gy - 3.6, 3, 7.2);
  ctx.fillStyle = "#d8c39a";
  ctx.beginPath(); ctx.arc(gx - 4, gy, 2.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(gx + 24, gy, 2.7, 0, TAU); ctx.fill();
  if (wind > 0.4) drawGlow("crescent", 180, 220, 255, tipX, gy, 16 * wind, 0.5 * wind);
}
/* the great tower shield: steel rim, lacquered face, pale mon, warded edge */
function drawShieldArt(bx, by, tilt, flash, phase) {
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(tilt);
  ctx.fillStyle = flash ? "#ffffff" : "#8b97ad";
  ctx.beginPath();
  ctx.moveTo(-8, -25); ctx.lineTo(10, -23); ctx.lineTo(12, 22); ctx.lineTo(-4, 25); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flash ? "#fff" : "#8e2f3c";
  ctx.beginPath();
  ctx.moveTo(-6, -22); ctx.lineTo(4, -21); ctx.lineTo(5, 20); ctx.lineTo(-2, 22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flash ? "#fff" : "#efe3cc";
  ctx.beginPath(); ctx.arc(0, -8, 3.6, 0, TAU); ctx.fill();
  ctx.fillRect(-1.4, -6, 2.8, 12);
  ctx.fillStyle = "#8e2f3c";
  ctx.beginPath(); ctx.arc(0, -8, 1.5, 0, TAU); ctx.fill();
  if (!flash) {
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(now * 3 + phase);
    ctx.strokeStyle = "#ffd9a0"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-8, -25); ctx.lineTo(10, -23); ctx.lineTo(12, 22); ctx.lineTo(-4, 25); ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
/* the fist closed on the grip, so a shield always looks carried */
function drawGauntletArt(bx, by, flash) {
  ctx.fillStyle = flash ? "#fff" : "#435274";
  ctx.beginPath(); ctx.arc(bx - 3, by + 7, 4.6, 0, TAU); ctx.fill();
}
function drawBombArt(bx, by) {
  ctx.fillStyle = "#1b1f28";
  ctx.beginPath(); ctx.arc(bx, by, 5.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#6b5a44"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(bx + 2, by - 4); ctx.lineTo(bx + 5, by - 8); ctx.stroke();
  const fs2 = 0.6 + 0.4 * Math.sin(now * 30);
  drawGlow("flame", 255, 180, 90, bx + 5, by - 9, 9 * fs2, 0.7);
}
/* the bomber's bandolier: three shells on a strap; `s` shrinks it onto a
   narrower chest */
function drawSatchelArt(shY, s) {
  ctx.save(); ctx.translate(0, shY + 6); ctx.rotate(-0.5); ctx.scale(s, s);
  ctx.fillStyle = "#3a2f22"; ctx.fillRect(-13, 0, 26, 4);
  ctx.fillStyle = "#20242c";
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-8 + i * 7, 2, 2.6, 0, TAU); ctx.fill(); }
  ctx.restore();
}

/* whatever the ninja is holding: that same art, hung off the same hand, driven
   by the same wind-up / active / recovery beats its former owner used */
function drawHeldWeapon(bx, by, sa, id, p, sh) {
  const A_ = atkCfg(p.atkKind);
  const live = p.attackT >= 0;
  if (id === "bow" || id === "storm") {
    /* the archer's draw: the string comes back, then snaps forward */
    let draw = 0;
    if (live && p.atkKind === "shot") draw = p.attackT < A_.a1 ? clamp(p.attackT / A_.a0, 0, 1)
      : clamp(1 - (p.attackT - A_.a1) / Math.max(0.001, A_.end - A_.a1) * 2.2, 0, 1);
    drawBowArt(bx + 4, by - 2, draw);
    return;
  }
  if (id === "shield") {
    /* raise into the wind-up, then punch the rim forward on the bash */
    let raise = 0, punch = 0;
    if (live && p.atkKind === "bash") {
      if (p.attackT < A_.a0) raise = clamp(p.attackT / A_.a0, 0, 1) * 5;
      else if (p.attackT < A_.a1) punch = Math.sin(clamp((p.attackT - A_.a0) / Math.max(0.001, A_.a1 - A_.a0), 0, 1) * Math.PI) * 13;
    }
    drawShieldArt(bx + 3 + punch, by - 7, -0.06 - raise * 0.05, false, p.anim);
    drawGauntletArt(bx + 3 + punch, by - 7, false);
    return;
  }
  if (id === "bombs") {
    let lob = 0;
    if (live && p.atkKind === "lob") lob = clamp(p.attackT / A_.a1, 0, 1);
    /* the satchel is the weapon, so it is worn, not just carried */
    drawSatchelArt(sh, 0.72);
    drawBombArt(bx + 4, by + 3 - Math.sin(lob * Math.PI) * 10);
    return;
  }
  if (id === "spear") {
    /* coil back on the wind-up, then ram the whole shaft through the thrust */
    let ext = 0, wind = 0;
    if (live && p.atkKind === "thrust") {
      if (p.attackT < A_.a0) { wind = clamp(p.attackT / A_.a0, 0, 1); ext = -18 * wind; }
      else if (p.attackT < A_.a1) ext = -18 + ((p.attackT - A_.a0) / Math.max(0.001, A_.a1 - A_.a0)) * 72;
      else ext = 54 * (1 - clamp((p.attackT - A_.a1) / Math.max(0.001, A_.end - A_.a1), 0, 1));
    }
    drawSpearArt(bx, by, ext, wind);
    return;
  }
  if (id === "club" || id === "tiger") { drawClubArt(bx, by, sa); return; }
  drawBladeArt(bx, by, sa);
}

/* a weapon sitting on the ground, waiting to be picked up - the foe's own art
   again, framed down into a small icon */
function drawWeaponGlyph(id, s) {
  ctx.save();
  ctx.scale(s, s);
  if (id === "katana") {
    /* the ninja's own sword keeps its own icon */
    ctx.fillStyle = WEAPON_TINT.katana;
    ctx.beginPath();
    ctx.moveTo(-0.83, 13); ctx.lineTo(1.5, -13); ctx.lineTo(-1.5, -13); ctx.lineTo(0.83, 13);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#c9b489"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-3.2, 10); ctx.lineTo(3.2, 10); ctx.stroke();
  } else if (id === "bow" || id === "storm") { ctx.scale(0.92, 0.92); ctx.translate(-7.5, 0); drawBowArt(0, 0, 0); }
  else if (id === "shield") { ctx.scale(0.62, 0.62); ctx.translate(-2, 0); drawShieldArt(0, 0, 0, false, 0); }
  else if (id === "bombs") { ctx.translate(-1, 2); drawBombArt(0, 0); }
  else if (id === "spear") { ctx.scale(0.28, 0.28); ctx.rotate(-Math.PI / 2); ctx.translate(-23, 0); drawSpearArt(0, 0, 0, 0); }
  else if (id === "club") { ctx.scale(0.6, 0.6); ctx.translate(0, 24); drawClubArt(0, 0, Math.PI); }
  else { ctx.scale(0.85, 0.85); ctx.translate(1, 19.5); drawBladeArt(0, 0, Math.PI); }
  ctx.restore();
}

function drawNinja() {
  const p = P;
  if (p.dead && p.deadT > 2.2) return;
  const cx = p.x + p.w / 2, fy = p.y + p.h;
  const blink = (p.invuln > 0 && !p.dead && Math.floor(now * 22) % 2 === 0);
  ctx.save();
  ctx.translate(cx, fy);
  if (blink) ctx.globalAlpha = 0.5;
  ctx.scale(p.facing, 1);

  for (const t of p.trail) {
    const a = t.life / t.max;
    ctx.globalAlpha = (blink ? 0.28 : 0.48) * a;
    ctx.fillStyle = "#4fb8ff";
    ctx.fillRect((t.x - cx) * p.facing, t.y - fy, t.w, t.h);
  }
  if (blink) ctx.globalAlpha = 0.5;

  /* a full kenki meter smoulders around the blade */
  if (p.focus >= CFG.focusMax && !p.dead) {
    drawGlow("kageAura", 165, 233, 255, 0, -p.h * 0.5, 38, 0.20 + 0.10 * Math.sin(now * 6));
    if (blink) ctx.globalAlpha = 0.5;
  }

  const sliding = p.state === "slide";
  const air = !p.onGround;
  const run = p.onGround && Math.abs(p.vx) > 25;
  const robe = p.merged ? (p.robeTint || "#d8464d") : C_BODY;
  const robeD = p.merged ? "#5e1a24" : C_DARK;
  const t = p.runPhase;
  const attacking = p.attackT >= 0;

  if (sliding) {
    ctx.fillStyle = C_DARK;
    ctx.beginPath(); ctx.ellipse(2, -10, 22, 8.5, -0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = C_BODY;
    ctx.beginPath(); ctx.arc(18, -16, 6.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = C_DARK; ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(-16, -3); ctx.stroke();
    drawScarf(p, cx, fy);
    ctx.strokeStyle = BLADE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(14, -22); ctx.lineTo(46, -32); ctx.stroke();
    ctx.globalAlpha = 0.2; ctx.fillStyle = "#7fd0ff";
    ctx.fillRect(-54, -18, 36, 16);
    ctx.globalAlpha = blink ? 0.5 : 1;
    ctx.fillStyle = C_BODY;
    ctx.beginPath(); ctx.arc(18, -16, 6.5, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    drawSlashFX(cx, fy, p);
    return;
  }

  let hipY = -24, sh = -36;
  let thA = 0.30, thB = -0.30, knA = 0.55, knB = 0.55;
  let arA = -1.5, arB = -0.5;
  let lean = 0;

  if (run) {
    const s = Math.sin(t);
    hipY = -24 - Math.abs(s) * 2;
    thA = s * 1.0; thB = -s * 1.0;
    knA = 0.30 + Math.max(0, -s) * 1.15;
    knB = 0.30 + Math.max(0, s) * 1.15;
    arA = -1.5 - s * 0.3; arB = -0.5 - s * 0.8;
    lean = clamp(p.vx / CFG.runSpeed, -1, 1) * 0.14;
  } else if (air) {
    const up = p.vy < 0;
    thA = up ? -0.30 : 0.80; thB = up ? 0.70 : -0.45;
    knA = up ? 1.25 : 0.5; knB = up ? 0.85 : 0.25;
    arA = -1.15; arB = -1.35;
    lean = 0.09;
  } else {
    const br = Math.sin(p.anim * 1.9) * 0.06;
    thA = 0.30 + br; thB = -0.30 - br;
    arA = -1.5 - br * 0.5; arB = -0.5 - br;
  }

  ctx.rotate(lean);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const TH = 13, SH = 13, UA = 10, FA = 10;

  /* back leg */
  const kb = seg(-4.5, hipY, thA, TH);
  const fb = seg(kb.x, kb.y, thA - knB, SH);
  limb(-4.5, hipY, kb.x, kb.y, 8.5, C_DARK);
  limb(kb.x, kb.y, fb.x, fb.y, 7, C_DARK);

  /* back arm */
  const eb = seg(-4, sh + 2, arB, UA);
  const hb = seg(eb.x, eb.y, arB + 0.75, FA);
  limb(-4, sh + 2, eb.x, eb.y, 7, C_DARK);
  limb(eb.x, eb.y, hb.x, hb.y, 6, C_DARK);

  /* torso */
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-6.5, hipY + 2);
  ctx.lineTo(-6, sh + 3);
  ctx.quadraticCurveTo(0, sh - 3, 6, sh + 3);
  ctx.lineTo(7, hipY + 3);
  ctx.quadraticCurveTo(0, hipY + 6, -6.5, hipY + 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(115,185,255,0.26)"; ctx.lineWidth = 1.1; ctx.stroke();
  /* sash */
  ctx.fillStyle = SCARF;
  ctx.beginPath();
  ctx.moveTo(-7.2, hipY + 2.5); ctx.lineTo(7.7, hipY + 3.5); ctx.lineTo(7.5, hipY - 0.5); ctx.lineTo(-7.2, hipY - 1);
  ctx.closePath(); ctx.fill();
  drawScarf(p, cx, fy);

  /* front leg */
  const kf = seg(4.5, hipY, thB, TH);
  const ff = seg(kf.x, kf.y, thB - knA, SH);
  limb(4.5, hipY, kf.x, kf.y, 9, robe);
  limb(kf.x, kf.y, ff.x, ff.y, 7.5, robe);
  ctx.fillStyle = C_MID;
  ctx.beginPath(); ctx.ellipse(ff.x + 2, ff.y - 2, 5, 2.6, 0, 0, TAU); ctx.fill();

  /* head */
  const hx = 2, hy = sh - 6;
  ctx.fillStyle = robe;
  ctx.beginPath(); ctx.arc(hx, hy, 6.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(140,200,255,0.3)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = C_DARK;
  ctx.beginPath(); ctx.arc(hx, hy - 1, 6.4, Math.PI * 0.92, Math.PI * 2.12); ctx.fill();
  ctx.fillStyle = attacking ? "#ff5a5a" : "#8fe6ff";
  ctx.fillRect(hx + 1.5, hy - 2.6, 6.6, 2.1);
  /* headband tail */
  ctx.strokeStyle = SCARF; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(hx - 5, hy - 2);
  ctx.quadraticCurveTo(hx - 11, hy - 5 + Math.sin(now * 8) * 2, hx - 17, hy - 2 + Math.sin(now * 8 + 1) * 3);
  ctx.stroke();

  /* front arm + weapon */
  let swing = arA;
  const unarmedNow = attacking && (p.atkKind === "punch" || p.atkKind === "kick" || p.atkKind === "round");
  const heldId = unarmedNow ? null : ((p.weapon && WEAPONS[p.weapon.id]) ? p.weapon.id : null);
  const heldDef = heldId ? WEAPONS[heldId] : null;
  const throwing = !!heldDef && (heldDef.kind === "ranged" || heldDef.kind === "bomb");
  if (attacking) {
    const kk = clamp(p.attackT / (p.atkKind === "kage" ? 0.26 : 0.2), 0, 1);
    if (throwing) swing = 0.62 - kk * 0.55;                       /* draw, then release */
    else if (p.atkKind === "plunge") swing = 0.15 - kk * 0.55;
    else if (p.atkKind === "kage") swing = lerp(-2.7, 2.0, kk);
    else if (p.atkKind === "lunge") swing = lerp(-0.5, 2.3, kk);
    else if (p.atkKind === "thrust") swing = 1.02 - kk * 0.06;    /* held level: a thrust, not an arc */
    else if (p.atkKind === "slam") swing = lerp(-2.1, 0.8, kk);   /* over the head, then down */
    else if (p.atkKind === "bash") swing = lerp(-0.3, 0.9, kk);
    else if (p.atkKind === "punch") swing = lerp(-0.9, 0.9, kk);
    else if (p.atkKind === "kick") swing = 0.4;
    else if (p.atkKind === "round") swing = lerp(-2.8, 2.8, kk);
    else if (heldId === "spear") swing = 0.95 - kk * 0.5;
    else swing = lerp(-2.4, 1.5, kk);
  }
  const ef = seg(3, sh + 2, swing, UA);
  const hf = seg(ef.x, ef.y, swing + 0.4, FA);
  limb(3, sh + 2, ef.x, ef.y, 7.5, robe);
  limb(ef.x, ef.y, hf.x, hf.y, 6.5, robe);

  const sa = swing + 0.5;
  const bx = hf.x + Math.sin(sa) * 3, by = hf.y + Math.cos(sa) * 3;
  if (heldId) {
    drawHeldWeapon(bx, by, sa, heldId, p, sh);
  } else {
    const tx = bx + Math.sin(sa) * 26, ty = by + Math.cos(sa) * 26;
    ctx.strokeStyle = "rgba(120,200,255,0.35)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = BLADE; ctx.lineWidth = 2.1;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = "#20293f";
    ctx.beginPath(); ctx.arc(bx, by, 2.8, 0, TAU); ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
  drawSlashFX(cx, fy, p);
}

function drawSlashFX(cx, fy, p) {
  if (p.attackT < 0) return;
  const kind = p.atkKind;
  /* a thrown weapon leaves no blade arc — the projectile is the tell */
  const hw = p.weapon && WEAPONS[p.weapon.id];
  if (hw && (hw.kind === "ranged" || hw.kind === "bomb")) return;
  const k = clamp(p.attackT / atkCfg(kind).end, 0, 1);
  const a = 1 - k;
  const p0 = Math.sin(k * Math.PI);

  /* ---- thrust: a thin line down the shaft, then a jab of light ---- */
  if (kind === "thrust") {
    const wr = weaponReach(p), ext = wr * (0.45 + 0.55 * p0);
    ctx.save();
    ctx.translate(p.facing > 0 ? cx + p.w * 0.5 - 4 : cx - p.w * 0.5 + 4, p.y + p.h * 0.30);
    ctx.scale(p.facing, 1);
    ctx.globalAlpha = a * 0.9;
    const g = ctx.createLinearGradient(0, 0, ext, 0);
    g.addColorStop(0, "rgba(230,245,255,0)");
    g.addColorStop(0.75, "rgba(235,248,255,0.9)");
    g.addColorStop(1, "rgba(180,225,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -2.2); ctx.lineTo(ext, -1.2); ctx.lineTo(ext, 1.2); ctx.lineTo(0, 2.2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = "#eaf7ff";
    ctx.beginPath(); ctx.ellipse(ext * 0.96, 0, 3.4, 5.2 * (0.5 + p0 * 0.5), 0, 0, TAU); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }

  if (kind === "punch" || kind === "kick" || kind === "round") {
    ctx.save();
    ctx.translate(cx, p.y + p.h * (kind === "punch" ? 0.35 : 0.6));
    ctx.scale(p.facing, 1);
    ctx.globalAlpha = a * 0.9;
    const col = kind === "punch" ? "190,225,255" : "255,200,140";
    ctx.strokeStyle = "rgba(" + col + ",0.95)";
    ctx.lineWidth = kind === "round" ? 7 : 5;
    ctx.beginPath();
    if (kind === "round") ctx.arc(0, -6, 30 * (0.5 + p0 * 0.5) + 8, -1.2 + k * 4, 1.2 + k * 4);
    else ctx.arc(0, 0, (kind === "kick" ? 30 : 20) * (0.5 + p0 * 0.5) + 6, -0.9, 0.9);
    ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }
  /* ---- slam: a heavy arc that ends in the floor ---- */
  if (kind === "slam") {
    const wr = weaponReach(p);
    ctx.save();
    ctx.translate(cx, fy);
    ctx.scale(p.facing, 1);
    ctx.globalAlpha = a * 0.85;
    ctx.rotate(lerp(-1.5, 0.5, k));
    const R = wr * (0.75 + 0.5 * p0), r0 = R * 0.55;
    const g = ctx.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, "rgba(255,240,220,0)");
    g.addColorStop(0.5, "rgba(255,236,200,0.9)");
    g.addColorStop(1, "rgba(220,180,120,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -p.h * 0.55, R, -1.15, 1.15);
    ctx.arc(0, -p.h * 0.55, r0, 1.15, -1.15, true);
    ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }

  /* ---- bash: a short, blunt shove with the shield rim ---- */
  if (kind === "bash") {
    ctx.save();
    ctx.translate(cx, fy - p.h * 0.5);
    ctx.scale(p.facing, 1);
    ctx.globalAlpha = a * 0.8;
    const L = 16 + 26 * p0;
    const g = ctx.createLinearGradient(0, 0, L, 0);
    g.addColorStop(0, "rgba(190,225,255,0)");
    g.addColorStop(0.6, "rgba(200,232,255,0.85)");
    g.addColorStop(1, "rgba(150,200,240,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(L * 0.7, 0, L * 0.5, 15, 0, 0, TAU); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }

  /* ---- plunge: a downward arc of light under the ninja ---- */
  if (kind === "plunge") {
    ctx.save();
    ctx.translate(cx, p.y + p.h - 4);
    ctx.scale(p.facing, 1);
    const R = 20 + 26 * p0;
    const g = ctx.createLinearGradient(0, 0, 0, R);
    g.addColorStop(0, "rgba(210,245,255,0.0)");
    g.addColorStop(0.45, "rgba(210,245,255,0.95)");
    g.addColorStop(1, "rgba(140,210,255,0.0)");
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-13, 2);
    ctx.quadraticCurveTo(0, R + 12, 13, 2);
    ctx.quadraticCurveTo(0, 7, -13, 2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(235,250,255,0.8)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-10, 4); ctx.quadraticCurveTo(0, R + 6, 10, 4); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }

  /* ---- lunge: a long horizontal streak ---- */
  if (kind === "lunge") {
    ctx.save();
    ctx.translate(cx, fy - p.h * 0.5);
    ctx.scale(p.facing, 1);
    ctx.globalAlpha = a * 0.9;
    const L = 26 + 34 * p0;
    const g = ctx.createLinearGradient(-L * 0.4, 0, L, 0);
    g.addColorStop(0, "rgba(200,240,255,0)");
    g.addColorStop(0.6, "rgba(220,245,255,0.95)");
    g.addColorStop(1, "rgba(150,215,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-L * 0.4, -3);
    ctx.quadraticCurveTo(L * 0.5, -20 - 6 * p0, L, 0);
    ctx.quadraticCurveTo(L * 0.5, 20 + 6 * p0, -L * 0.4, 3);
    ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }

  const cy = fy - p.h * 0.55;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(p.facing, 1);
  ctx.globalAlpha = a * 0.95;
  const kage = kind === "kage";
  const R2 = (kage ? 30 : 20) + (kage ? 62 : 40) * p0;
  const R1 = R2 * (kage ? 0.5 : 0.58);
  const spread = kage ? 1.8 : 1.4;
  const rot = lerp(kage ? -1.2 : -0.9, kage ? 1.0 : 0.8, k);
  ctx.rotate(rot);
  const g = ctx.createLinearGradient(0, -R2, 0, R2);
  if (kage) {
    g.addColorStop(0, "rgba(200,240,255,0.0)");
    g.addColorStop(0.42, "rgba(255,255,255,0.98)");
    g.addColorStop(0.62, "rgba(160,235,255,0.9)");
    g.addColorStop(1, "rgba(110,200,255,0.0)");
  } else {
    g.addColorStop(0, "rgba(220,245,255,0.0)");
    g.addColorStop(0.5, "rgba(200,240,255,0.9)");
    g.addColorStop(1, "rgba(160,220,255,0.0)");
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R2, -spread, spread);
  ctx.arc(0, 0, R1, spread, -spread, true);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = a * (kage ? 0.9 : 0.7);
  ctx.strokeStyle = kage ? "#ffffff" : "#eaf7ff"; ctx.lineWidth = kage ? 2.4 : 1.6;
  ctx.beginPath(); ctx.arc(0, 0, R2 * 0.92, -spread, spread); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------- enemies  */
function drawEnemies() {
  worldT(1, 1);
  for (const e of enemies) {
    if (e.x + e.w < cam.x - 80 || e.x > cam.x + VW + 80) continue;
    const cx = e.x + e.w / 2, by = e.y + e.h;
    ctx.save(); ctx.translate(cx, by); ctx.scale(e.facing, 1);
    const flash = e.hitFlash > 0;
    const dying = e.dead;
    if (dying) ctx.globalAlpha = Math.max(0, 1 - e.deathT / 0.9);
    const acc = e.type === "grunt" ? "#d84b4b" : e.type === "archer" ? "#4b8ad8" : e.type === "brute" ? "#d8813b" : e.type === "spearman" ? "#c9a24b" : e.type === "bomber" ? "#d8623b" : "#a05ce0";
    if (e.type === "wraith") ctx.globalAlpha *= 0.82;

    if (e.type === "grunt" || e.type === "archer") {
      const t = e.anim * (e.state === "walk" ? 7 : 2);
      const moving = e.type === "grunt" && e.state === "walk";
      const s = Math.sin(t);
      const bob = moving ? -Math.abs(s) * 1.4 : Math.sin(e.anim * 2) * 0.7;
      const hipY = -22 + bob, shY = -34 + bob, headY = -40 + bob;
      limb(0, hipY, s * 7, 0, 7, "#070a12");
      limb(0, hipY, -s * 7, 0, 7, "#0a0e19");
      ctx.fillStyle = flash ? "#ffffff" : "#0c1120";
      ctx.beginPath();
      ctx.moveTo(-7, hipY); ctx.lineTo(-6, shY + 1); ctx.quadraticCurveTo(0, shY - 4, 6, shY + 1);
      ctx.lineTo(7, hipY + 1); ctx.quadraticCurveTo(0, hipY + 4, -7, hipY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = flash ? "#ffffff" : "#131a2c";
      ctx.beginPath(); ctx.arc(1, headY, 6.5, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? "#ffffff" : "#182135";
      ctx.beginPath();
      ctx.moveTo(-13, headY - 5); ctx.lineTo(1, headY - 16); ctx.lineTo(15, headY - 5);
      ctx.quadraticCurveTo(1, headY - 2, -13, headY - 5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = acc;
      ctx.fillRect(-7, shY + 3, 14, 2.6);
      ctx.fillStyle = "#ffb3b3"; ctx.fillRect(2, headY - 3, 5, 1.6);
      const wind = e.state === "wind" ? clamp(e.t / 0.4, 0, 1) : 0;
      const str = e.state === "strike" ? 1 : 0;
      if (e.type === "grunt") {
        const ang = -0.6 - wind * 1.1 + str * 2.0;
        const hx = 6 + Math.sin(ang) * 16, hy = shY + 8 + Math.cos(ang) * 10;
        limb(3, shY + 2, hx, hy, 5.5, "#0a0e19");
        drawBladeArt(hx, hy, ang);
      } else {
        limb(3, shY + 2, 9, shY + 10, 5.5, "#0a0e19");
        const draw = e.state === "draw" ? clamp(e.t / 0.62, 0, 1) : 0;
        drawBowArt(13, shY + 8, draw);
      }
    } else if (e.type === "brute") {
      const t = e.anim * 4;
      const s = Math.sin(t);
      const hipY = -30, shY = -50, headY = -58;
      limb(-3, hipY, s * 8 - 3, 0, 11, "#070a12");
      limb(3, hipY, -s * 8 + 3, 0, 11, "#0a0e19");
      ctx.fillStyle = flash ? "#fff" : "#0d1220";
      ctx.beginPath();
      ctx.moveTo(-13, hipY + 2); ctx.lineTo(-12, shY); ctx.quadraticCurveTo(0, shY - 8, 12, shY);
      ctx.lineTo(14, hipY + 4); ctx.quadraticCurveTo(0, hipY + 8, -13, hipY + 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = acc; ctx.fillRect(-12, shY + 6, 24, 4);
      ctx.beginPath(); ctx.arc(-14, shY + 4, 7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(14, shY + 4, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? "#fff" : "#141b2c";
      ctx.beginPath(); ctx.arc(1, headY, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffb3b3"; ctx.fillRect(2, headY - 3, 7, 2);
      const wind = e.state === "wind" ? clamp(e.t / 0.62, 0, 1) : 0;
      const str = e.state === "strike" ? clamp(e.t / 0.24, 0, 1) : (e.state === "rec" ? 1 : 0);
      const ang = -1.5 - wind * 0.7 + str * 3.1;
      const hx = 10 + Math.sin(ang) * 20, hy = shY + 8 + Math.cos(ang) * 16;
      limb(8, shY + 4, hx, hy, 9, "#0a0e19");
      drawClubArt(hx, hy, ang);
    } else if (e.type === "shield") {
      const t = e.anim * 3.2;
      const bob = e.state === "walk" ? -Math.abs(Math.sin(t)) * 1.6 : Math.sin(e.anim * 2) * 0.6;
      const hipY = -22 + bob, shY = -34 + bob, headY = -41 + bob;
      /* legs */
      limb(-4, hipY, Math.sin(t) * 6 - 3, 0, 8.5, "#1b2540");
      limb(4, hipY, -Math.sin(t) * 6 + 3, 0, 8.5, "#243050");
      /* torso — lamellar armour, deliberately lighter than the other foes */
      ctx.fillStyle = flash ? "#ffffff" : "#33405e";
      ctx.beginPath();
      ctx.moveTo(-9, hipY + 2); ctx.lineTo(-8, shY + 1); ctx.quadraticCurveTo(0, shY - 5, 8, shY + 1);
      ctx.lineTo(10, hipY + 3); ctx.quadraticCurveTo(0, hipY + 7, -9, hipY + 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(180,205,240,0.35)"; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(-8, shY + 7 + i * 6); ctx.lineTo(8.5, shY + 8 + i * 6); ctx.stroke();
      }
      /* sash */
      ctx.fillStyle = "#8e2f3c";
      ctx.fillRect(-9, hipY - 1, 19, 3.4);
      /* helmet + face plate */
      ctx.fillStyle = flash ? "#ffffff" : "#435274";
      ctx.beginPath(); ctx.arc(1, headY, 7.8, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? "#fff" : "#5d6e94";
      ctx.beginPath();
      ctx.moveTo(-11, headY - 2); ctx.lineTo(1, headY - 14); ctx.lineTo(13, headY - 2);
      ctx.quadraticCurveTo(1, headY + 1, -11, headY - 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(200,225,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#141b2c";
      ctx.beginPath(); ctx.ellipse(5, headY - 2, 5, 3.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffd45a";
      ctx.fillRect(4, headY - 3, 4.5, 1.8);
      /* banner pole + war flag */
      ctx.strokeStyle = "#3a2340"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(-7, shY + 2); ctx.lineTo(-13, shY - 32); ctx.stroke();
      ctx.fillStyle = "#a3283f";
      ctx.beginPath(); ctx.moveTo(-13, shY - 32); ctx.lineTo(-33, shY - 25); ctx.lineTo(-13, shY - 15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,235,200,0.85)";
      ctx.beginPath(); ctx.arc(-21, shY - 24, 2.6, 0, TAU); ctx.fill();
      /* ---- the great tower shield: lacquered crimson with a steel rim ---- */
      const raise = e.state === "wind" ? clamp(e.t / 0.5, 0, 1) * 5 : 0;
      const punch = e.state === "strike" ? Math.sin(clamp(e.t / 0.2, 0, 1) * Math.PI) * 13 : 0;
      const sx = 6 + punch, sy = hipY + bob + raise * 0.3;
      drawShieldArt(sx, sy, -0.06 - raise * 0.05, flash, e.anim);
      drawGauntletArt(sx, sy, flash);
    } else if (e.type === "spearman") {
      const t = e.anim * (e.state === "walk" ? 6 : 2.4);
      const s = Math.sin(t);
      const bob = e.state === "walk" ? -Math.abs(s) * 1.4 : Math.sin(e.anim * 2) * 0.6;
      const hipY = -24 + bob, shY = -38 + bob, headY = -46 + bob;
      limb(-3, hipY, s * 7 - 2, 0, 8, "#070a12");
      limb(3, hipY, -s * 7 + 2, 0, 8, "#0a0e19");
      ctx.fillStyle = flash ? "#fff" : "#111826";
      ctx.beginPath();
      ctx.moveTo(-8, hipY + 2); ctx.lineTo(-7, shY + 1); ctx.quadraticCurveTo(0, shY - 5, 7, shY + 1);
      ctx.lineTo(8.5, hipY + 3); ctx.quadraticCurveTo(0, hipY + 6, -8, hipY + 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(210,190,140,0.25)"; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-7, shY + 6 + i * 6); ctx.lineTo(7.5, shY + 7 + i * 6); ctx.stroke(); }
      ctx.fillStyle = acc; ctx.fillRect(-8, hipY - 1, 17, 3);
      ctx.fillStyle = flash ? "#fff" : "#1a222f";
      ctx.beginPath(); ctx.arc(0, headY, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? "#fff" : "#232d3d";
      ctx.beginPath(); ctx.moveTo(-12, headY - 3); ctx.lineTo(0, headY - 13); ctx.lineTo(12, headY - 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffb3b3"; ctx.fillRect(2, headY - 3, 5, 1.6);
      /* the yari: coils back on the wind-up, then stabs out well past the body */
      const wind = e.state === "wind" ? clamp(e.t / 0.72, 0, 1) : 0;
      const th = e.state === "thrust" ? clamp(e.t / 0.26, 0, 1) : 0;
      const ext = -wind * 18 + th * 54;
      drawSpearArt(2 + ext * 0.4, shY + 8, ext, wind);
    } else if (e.type === "bomber") {
      const t = e.anim * (e.state === "walk" ? 6 : 2.4);
      const s = Math.sin(t);
      const bob = e.state === "walk" ? -Math.abs(s) * 1.3 : Math.sin(e.anim * 2) * 0.6;
      const hipY = -20 + bob, shY = -32 + bob, headY = -39 + bob;
      limb(-4, hipY, s * 6 - 2, 0, 7, "#070a12");
      limb(4, hipY, -s * 6 + 2, 0, 7, "#0a0e19");
      ctx.fillStyle = flash ? "#fff" : "#141a26";
      ctx.beginPath();
      ctx.moveTo(-9, hipY + 2); ctx.quadraticCurveTo(-11, shY - 2, -3, shY - 2);
      ctx.quadraticCurveTo(6, shY - 4, 9, shY + 4); ctx.lineTo(9, hipY + 4);
      ctx.quadraticCurveTo(0, hipY + 7, -9, hipY + 2); ctx.closePath(); ctx.fill();
      drawSatchelArt(shY, 1);
      ctx.fillStyle = flash ? "#fff" : "#232c3a";
      ctx.beginPath(); ctx.arc(1, headY, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = "#0c1118";
      ctx.beginPath(); ctx.moveTo(-8, headY + 2); ctx.quadraticCurveTo(1, headY - 12, 10, headY + 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffd27a";
      ctx.beginPath(); ctx.arc(4, headY - 2, 1.8, 0, TAU); ctx.fill();
      const lob = e.state === "lob" ? clamp(e.t / 0.5, 0, 1) : 0;
      const hx = 9 + lob * 3, hy = shY + 2 - Math.sin(lob * Math.PI) * 10;
      drawBombArt(hx, hy);
    } else if (e.type === "wraith") {
      const w = 13 + Math.sin(e.anim * 3) * 2;
      ctx.fillStyle = flash ? "#fff" : "rgba(60,26,96,0.9)";
      ctx.beginPath();
      ctx.moveTo(-w, -30);
      ctx.quadraticCurveTo(0, -40, w, -30);
      ctx.quadraticCurveTo(w * 0.7, -6, w * 1.3, 0);
      ctx.quadraticCurveTo(w * 0.3, -5, 0, 2);
      ctx.quadraticCurveTo(-w * 0.3, -5, -w * 1.3, 0);
      ctx.quadraticCurveTo(-w * 0.7, -6, -w, -30);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e44bff";
      ctx.beginPath(); ctx.ellipse(3, -28, 2.4, 3, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-4, -28, 2.4, 3, 0, 0, TAU); ctx.fill();
      const g = ctx.createRadialGradient(0, -26, 2, 0, -26, 40);
      g.addColorStop(0, "rgba(190,110,255,0.25)"); g.addColorStop(1, "rgba(150,80,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -26, 40, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------- kitsune -- */
function drawKitsune(k, cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  const tilt = clamp(k.vy * 0.0012, -0.32, 0.32);
  ctx.rotate(tilt);
  ctx.scale(k.facing, 1);

  const t = k.anim;
  const flying = Math.hypot(k.vx, k.vy) > 220;

  /* spirit aura */
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.1);
  const ar = 25 + pulse * 5;
  const ag = ctx.createRadialGradient(0, 0, 2, 0, 0, ar);
  ag.addColorStop(0, `rgba(255,214,130,${0.20 + pulse * 0.11})`);
  ag.addColorStop(0.55, "rgba(255,190,90,0.075)");
  ag.addColorStop(1, "rgba(255,170,60,0)");
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(0, 0, ar, 0, TAU); ctx.fill();

  /* tail */
  const N = 7, tp = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    tp.push({
      x: -7 - u * 13,
      y: -2 - u * 9 + Math.sin(t * 3.2 - u * 2.6) * (1.0 + u * 2.2) + u * u * 3,
      w: 2.2 + Math.sin(Math.min(1, u * 1.05) * Math.PI) * 3.4,
    });
  }
  const tl = [], tr = [];
  for (let i = 0; i <= N; i++) {
    const q = tp[i];
    const a = tp[Math.max(0, i - 1)], b = tp[Math.min(N, i + 1)];
    const dl = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const nx = -(b.y - a.y) / dl, ny = (b.x - a.x) / dl;
    tl.push([q.x + nx * q.w, q.y + ny * q.w]);
    tr.push([q.x - nx * q.w, q.y - ny * q.w]);
  }
  ctx.fillStyle = "#e9d8b8";
  ctx.beginPath();
  for (let i = 0; i <= N; i++) { const q = tl[i]; i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  for (let i = N; i >= 0; i--) { const q = tr[i]; ctx.lineTo(q[0], q[1]); }
  ctx.closePath(); ctx.fill();
  const ta = tp[N - 1], tb = tp[N];
  ctx.save();
  ctx.translate(tb.x, tb.y);
  ctx.rotate(Math.atan2(tb.y - ta.y, tb.x - ta.x));
  ctx.fillStyle = "#fffdf7";
  ctx.beginPath(); ctx.ellipse(0.4, 0, 4.4, 3.6, 0, 0, TAU); ctx.fill();
  ctx.restore();

  /* the fire lingering around its tail — swells to a lantern in the dark */
  const darkBoost = (typeof isDarkLevel === "function" && isDarkLevel()) ? 1.9 : 1;
  const fl = (0.75 + 0.25 * Math.sin(t * 7.3)) * darkBoost;
  const fx = -17.5 - Math.sin(t * 2.4) * 3, fy = -15 - Math.sin(t * 3.1) * 2.4;
  const fgd = ctx.createRadialGradient(fx, fy, 0.5, fx, fy, 9 * fl);
  fgd.addColorStop(0, "rgba(255,250,220,0.95)");
  fgd.addColorStop(0.42, "rgba(255,190,80,0.8)");
  fgd.addColorStop(1, "rgba(255,150,40,0)");
  ctx.fillStyle = fgd;
  ctx.beginPath(); ctx.arc(fx, fy, 9 * fl, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fff6d8";
  ctx.beginPath();
  ctx.moveTo(fx, fy - 3.8 * fl);
  ctx.quadraticCurveTo(fx + 2.7 * darkBoost, fy, fx, fy + 3.3 * fl);
  ctx.quadraticCurveTo(fx - 2.7 * darkBoost, fy, fx, fy - 3.8 * fl);
  ctx.fill();
  if (darkBoost > 1) {
    ctx.fillStyle = "rgba(255,190,110,0.35)";
    ctx.beginPath(); ctx.arc(fx, fy, 15 * fl, 0, TAU); ctx.fill();
  }

  /* legs */
  ctx.lineCap = "round";
  const legPhase = t * (flying ? 9 : 3.2);
  const legAmp = flying ? 0.52 : 0.2;
  const leg = (x0, ph) => {
    const a = 0.30 + Math.sin(legPhase + ph) * legAmp;
    const kx = x0 + Math.sin(a) * 5.6, ky = 3.4 + Math.cos(a) * 7.6;
    ctx.strokeStyle = C_FUR2; ctx.lineWidth = 2.9;
    ctx.beginPath(); ctx.moveTo(x0, 3.2); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.fillStyle = C_FUR3;
    ctx.beginPath(); ctx.arc(kx, ky, 1.7, 0, TAU); ctx.fill();
  };
  leg(-6.6, 0); leg(-4.6, 1.7); leg(2.6, 3.2); leg(4.8, 4.7);

  /* body */
  ctx.fillStyle = C_FUR;
  ctx.beginPath(); ctx.ellipse(-1.6, 1.4, 7.4, 5.5, -0.08, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-6.2, 0.6, 5.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4, 1.2, 4.6, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fffaf0";
  ctx.beginPath(); ctx.ellipse(2.6, 2.7, 3.6, 2.9, -0.1, 0, TAU); ctx.fill();
  ctx.strokeStyle = C_FOXRED; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-7.4, -1.2); ctx.quadraticCurveTo(-1.6, -4.9, 4.2, -2.8); ctx.stroke();

  /* head */
  const hx = 9.4, hy = -4;
  ctx.fillStyle = C_FUR;
  ctx.beginPath(); ctx.arc(hx, hy, 5.7, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx - 3.5, hy - 2.9); ctx.lineTo(hx - 4.8, hy - 10.6); ctx.lineTo(hx + 0.7, hy - 4.3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + 0.5, hy - 4.6); ctx.lineTo(hx + 2.3, hy - 11.3); ctx.lineTo(hx + 4.7, hy - 3.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C_FOXRED;
  ctx.beginPath();
  ctx.moveTo(hx - 3.3, hy - 3.7); ctx.lineTo(hx - 4.3, hy - 9.3); ctx.lineTo(hx - 0.6, hy - 4.7);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + 1.1, hy - 5.0); ctx.lineTo(hx + 2.3, hy - 10.0); ctx.lineTo(hx + 4.1, hy - 4.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fffaf0";
  ctx.beginPath();
  ctx.moveTo(hx + 2.6, hy + 0.9); ctx.lineTo(hx + 7.7, hy + 1.9); ctx.lineTo(hx + 2.7, hy + 4.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2b2733";
  ctx.beginPath(); ctx.arc(hx + 7.5, hy + 2.0, 1.05, 0, TAU); ctx.fill();
  ctx.fillStyle = "#25202c";
  ctx.beginPath(); ctx.ellipse(hx + 2.1, hy - 0.6, 0.95, 1.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C_FOXRED; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(hx - 1.5, hy - 3.4); ctx.lineTo(hx + 0.4, hy - 1.1); ctx.stroke();

  /* impact flash */
  if (k.flash > 0) {
    const a = clamp(k.flash / 0.3, 0, 1);
    ctx.globalAlpha = a * 0.32;
    ctx.fillStyle = "#fff8e0";
    ctx.beginPath(); ctx.arc(-1, -1, 14, 0, TAU); ctx.fill();
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = "#fff3d0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -2, 15 + (1 - a) * 11, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPet() {

  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(-30, -58); ctx.quadraticCurveTo(0, -46, 30, -58);
  ctx.lineTo(24, -30); ctx.quadraticCurveTo(0, -22, -24, -30);
  ctx.closePath(); ctx.fill();

  /* ---- head ---- */
  const headY = -134 + po.head * 14;
  ctx.fillStyle = flash ? "#fff" : "#2a1620";
  for (let i = 0; i < 10; i++) {
    const a = -2.75 + i * 0.4;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * 30, headY + Math.sin(a) * 26, 21, 8.5, a, 0, TAU);
    ctx.fill();
  }
  /* topknot */
  ctx.fillStyle = "#241320";
  ctx.beginPath();
  ctx.moveTo(-7, headY - 21);
  ctx.quadraticCurveTo(-4, headY - 52, 9, headY - 49);
  ctx.quadraticCurveTo(3, headY - 30, 5, headY - 20);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8b98e";
  ctx.fillRect(-7, headY - 27, 13, 4.5);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, headY, 23, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, headY + 13, 16, 10, 0, 0, TAU); ctx.fill();
  /* mouth — a permanent fanged snarl that widens for roars and attacks */
  const mOpen = clamp(po.mouth, 0, 1);
  ctx.fillStyle = "#2a0810";
  ctx.beginPath(); ctx.ellipse(8, headY + 12 + mOpen * 2, 12 + mOpen * 3, 5 + mOpen * 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f2ead6";
  for (let i = 0; i < 4; i++) {
    const fx = 0.5 + i * 6.1 + mOpen;
    ctx.beginPath();
    ctx.moveTo(fx, headY + 9 - mOpen * 4);
    ctx.lineTo(fx + 3, headY + 16 + mOpen * 5);
    ctx.lineTo(fx + 6.1, headY + 9 - mOpen * 4);
    ctx.closePath(); ctx.fill();
  }
  /* lower tusks jutting up from the jaw */
  ctx.fillStyle = "#e8dfc8";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(8 + s * 12.5, headY + 17 + mOpen * 3);
    ctx.lineTo(8 + s * 10, headY + 5 + mOpen * 4);
    ctx.lineTo(8 + s * 7.5, headY + 17 + mOpen * 3);
    ctx.closePath(); ctx.fill();
  }
  /* eyes — narrowed, angry, smouldering */
  const eg = 0.55 + 0.45 * Math.sin(t * 3.4);
  const eag = ctx.createRadialGradient(2, headY - 5, 2, 2, headY - 5, 28);
  eag.addColorStop(0, `rgba(255,196,60,${0.32 * (0.5 + eg * 0.5)})`);
  eag.addColorStop(1, "rgba(255,150,40,0)");
  ctx.fillStyle = eag;
  ctx.beginPath(); ctx.arc(2, headY - 5, 28, 0, TAU); ctx.fill();
  ctx.globalAlpha = ctx.globalAlpha * (0.72 + eg * 0.28);
  for (const s of [-1, 1]) {
    ctx.fillStyle = eyeC;
    ctx.beginPath();
    ctx.moveTo(s * 2, headY - 8);
    ctx.lineTo(s * 17.5, headY - 11.5);
    ctx.lineTo(s * 18.5, headY - 4.5);
    ctx.lineTo(s * 4, headY - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2a0d0a";
    ctx.beginPath(); ctx.ellipse(s * 10.5, headY - 6.5, 2.2, 3.4, s * 0.16, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = b.dead ? clamp(1 - b.deathT / 2.6, 0.02, 1) : 1;
  /* heavy scowling brows */
  ctx.strokeStyle = flash ? "#fff" : "#2a0d16"; ctx.lineWidth = 5.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-19, headY - 16); ctx.lineTo(-2, headY - 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(21, headY - 15); ctx.lineTo(4, headY - 2); ctx.stroke();
  /* horns */
  ctx.fillStyle = hornC;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 8, headY - 18);
    ctx.quadraticCurveTo(s * 18, headY - 40, s * 34, headY - 34);
    ctx.quadraticCurveTo(s * 22, headY - 32, s * 14, headY - 10);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#a9967a";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 12, headY - 20);
    ctx.quadraticCurveTo(s * 20, headY - 36, s * 30, headY - 32);
    ctx.quadraticCurveTo(s * 20, headY - 30, s * 13, headY - 14);
    ctx.closePath(); ctx.fill();
  }
  /* horn ridges */
  ctx.strokeStyle = "rgba(90,70,48,0.55)"; ctx.lineWidth = 1.6;
  for (const s of [-1, 1]) {
    for (let i = 1; i <= 3; i++) {
      const u = i / 4;
      const bx = s * (8 + 20 * u), by = headY - 18 - 16 * Math.sin(u * Math.PI * 0.9);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + s * 4, by + 5); ctx.stroke();
    }
  }

  /* ---- near arm + kanabō ---- */
  const nax = 28 + Math.sin(po.armA) * 31, nay = shY + Math.cos(po.armA) * 31;
  ctx.strokeStyle = skin; ctx.lineWidth = 22; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(28, shY); ctx.lineTo(nax, nay); ctx.stroke();
  const hx2 = nax + Math.sin(po.armA - 0.45) * 26, hy2 = nay + Math.cos(po.armA - 0.45) * 26;
  ctx.strokeStyle = skinL; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(nax, nay); ctx.lineTo(hx2, hy2); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(hx2, hy2, 13, 0, TAU); ctx.fill();

  if (!b.weaponShattered) {
  ctx.save();
  ctx.translate(hx2, hy2);
  ctx.rotate(po.club);
  ctx.fillStyle = flash ? "#fff" : "#2c2430";
  ctx.beginPath();
  ctx.moveTo(-8, 4); ctx.lineTo(-12, 76);
  ctx.quadraticCurveTo(0, 98, 12, 76);
  ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flash ? "#fff" : "#4a4252";
  ctx.beginPath(); ctx.moveTo(-12, 76); ctx.quadraticCurveTo(0, 98, 12, 76); ctx.lineTo(11, 66); ctx.quadraticCurveTo(0, 86, -11, 66); ctx.closePath(); ctx.fill();
  if (!flash) {
    ctx.fillStyle = "#8b8296";
    for (let i = 0; i < 4; i++) for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 8, 20 + i * 15, 3.2, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = "#1a141e"; ctx.fillRect(-6, -10, 12, 20);
  ctx.restore();
  }

  /* ---- near leg (drawn last so it reads in front) ---- */
  legDraw(1, 3.14, skin, skinD);

  /* charge / slam telegraph glow */
  if (po.glow > 0) {
    const g = ctx.createRadialGradient(28, shY, 4, 28, shY, 90);
    g.addColorStop(0, `rgba(255,120,60,${0.30 * po.glow})`);
    g.addColorStop(1, "rgba(255,80,40,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(28, shY, 90, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBossBar() {
  const list = bossList();
  if (!list.length) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const u = clamp(Math.min(W, H) / 330, 0.72, 1.7);
  const bw = Math.min(W * 0.62, 420 * u), bh = 9 * u;
  const bx = (W - bw) / 2;
  list.forEach((bb, i) => {
    const by = 42 * u + SAFE.t + i * 30 * u;
    const frac = clamp(bb.hp / bb.maxHp, 0, 1);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillStyle = bb.twin ? "rgba(190,200,255,0.9)" : "rgba(255,190,170,0.9)";
    ctx.font = `700 ${Math.round(10 * u)}px system-ui, sans-serif`;
    ctx.fillText(bb.name || BOSS_DEF_FALLBACK.name, W / 2, by - 5 * u);
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(20,10,14,0.75)";
    ctx.fillRect(bx - 2 * u, by - 2 * u, bw + 4 * u, bh + 4 * u);
    ctx.fillStyle = "rgba(90,40,50,0.7)";
    ctx.fillRect(bx, by, bw, bh);
    const cols = bb.phase === 1 ? ["#ffbb62", "#ff6a3c"] : bb.phase === 2 ? ["#ff9250", "#ec3a26"] : ["#ff7a5a", "#c81a1a"];
    const g = ctx.createLinearGradient(0, by, 0, by + bh);
    g.addColorStop(0, cols[0]);
    g.addColorStop(1, cols[1]);
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * frac, bh);
    ctx.fillStyle = "rgba(255,240,220,0.55)";
    ctx.fillRect(bx, by, bw * frac, 1.4 * u);
    if (!bb.twin) {
      ctx.fillStyle = "rgba(10,6,10,0.8)";
      for (const p of [0.66, 0.33]) ctx.fillRect(bx + bw * p - 1, by - 2 * u, 2, bh + 4 * u);
    }
    ctx.strokeStyle = "rgba(255,220,190,0.5)"; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    if (!bb.twin) {
      const reached = frac > 0.66 ? 1 : frac > 0.33 ? 2 : 3;
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = i < reached ? 1 : 0.22;
        ctx.fillStyle = "#ff8a5a";
        ctx.fillRect(bx + bw + 6 * u, by + i * (bh / 3), 5 * u, bh / 3 - 1);
      }
      ctx.globalAlpha = 1;
    }
  });
  ctx.globalAlpha = 1;
}

/* the ending: three beats — the kill, the tally, the invitation to the night */
function drawVictory() {
  const a = clamp(overT / 1.0, 0, 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgba(2,4,10,${0.74 * a})`;
  ctx.fillRect(0, 0, W, H);
  const u = clamp(Math.min(W, H) / 420, 0.62, 2.0);
  const cx = W / 2;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const p1 = clamp(overT / 0.9, 0, 1);
  ctx.globalAlpha = p1;
  ctx.fillStyle = "rgba(224,69,74,0.9)";
  ctx.fillRect(cx - 28 * u, H * 0.15, 56 * u, 2.5 * u);
  ctx.fillStyle = "#ffd479";
  ctx.font = `800 ${Math.round(36 * u)}px "Shippori Mincho", serif`;
  ctx.fillText((() => { const c7 = (progress.choices && progress.choices[7] !== undefined) ? progress.choices[7] : (SAVE.choices ? SAVE.choices[7] : undefined); if (c7 === 0) return "THE DREAM FORGIVEN"; return "THE MISFORTUNE BREAKS"; })(), cx, H * 0.27);
  ctx.fillStyle = "rgba(185,205,235,0.9)";
  ctx.font = `600 ${Math.round(10.5 * u)}px system-ui, sans-serif`;
  ctx.fillText("SOSUKE IS FREED — DAWN OVER THE CRANE VILLAGE", cx, H * 0.27 + 32 * u);

  if (overT > 1.5) {
    const p2 = clamp((overT - 1.5) / 0.9, 0, 1);
    ctx.globalAlpha = p2;
    const yy = H * 0.50;
    const cols = [
      ["SCORE", Math.floor(game.score).toLocaleString()],
      ["KILLS", String(game.kills)],
      ["BEST", Math.floor(game.best).toLocaleString()],
      ["DIFFICULTY", (DIFF_DEFS[SAVE.diff] || DIFF_DEFS[1]).name],
    ];
    const step = Math.min(W / 5.2, 148 * u);
    const x0 = cx - step * (cols.length - 1) / 2;
    for (let i = 0; i < cols.length; i++) {
      const x = x0 + i * step;
      ctx.fillStyle = "#eaf2ff";
      ctx.font = `700 ${Math.round(17 * u)}px "Shippori Mincho", serif`;
      ctx.fillText(cols[i][1], x, yy);
      ctx.fillStyle = "rgba(150,180,215,0.85)";
      ctx.font = `600 ${Math.round(9 * u)}px system-ui, sans-serif`;
      ctx.fillText(cols[i][0], x, yy + 18 * u);
    }
    ctx.globalAlpha = p2 * 0.9;
    ctx.fillStyle = "rgba(185,205,235,0.85)";
    ctx.font = `${Math.round(10 * u)}px system-ui, sans-serif`;
    ctx.fillText("THE NIGHT GOES ON — THANK YOU FOR PLAYING", cx, H * 0.72);
  }

  if (overT > 2.6) {
    const pulse = 0.5 + 0.5 * Math.sin(now * 3);
    ctx.globalAlpha = a * pulse;
    ctx.fillStyle = "#dcecff";
    ctx.font = `700 ${Math.round(12 * u)}px system-ui, sans-serif`;
    ctx.fillText("TAP  —  ENDLESS NIGHT", cx, H * 0.88);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = "alphabetic";
}

function drawBossSheet() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#1b1420"; ctx.fillRect(0, 0, W, H);
  const poses = [
    ["wake", 0.8], ["stalk", 0.4], ["wind", 0.75], ["slam", 0.12],
    ["stagger", 0.4], ["charge", 0.3], ["throw", 0.28], ["summon", 0.5],
  ];
  const cols = 4, rows = 2;
  const cw = W / cols, chh = H / rows;
  const sc = Math.min(cw / 210, chh / 250);
  poses.forEach((ps, i) => {
    const col = i % cols, row = (i / cols) | 0;
    const px = col * cw + cw / 2, py = row * chh + chh * 0.86;
    const fake = {
      state: ps[0], t: ps[1], anim: 0.9, facing: 1, hitFlash: 0, invuln: 0,
      dead: false, deathT: 0, w: 136, h: 158, hp: 64, maxHp: 64, phase: 2,
    };
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(sc, sc);
    drawBossBody(fake, 0, 0);
    ctx.restore();
    ctx.fillStyle = "rgba(230,200,255,0.85)";
    ctx.font = "10px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(ps[0], px, row * chh + chh * 0.97);
  });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawProjs() {
  worldT(1, 1);
  for (const pr of projs) {
    if (pr.type === "blast") {
      const k = clamp(pr.life / 0.38, 0, 1);
      ctx.globalAlpha = k * 0.9;
      const g = ctx.createRadialGradient(pr.x, pr.y, pr.r * 0.2, pr.x, pr.y, pr.r);
      g.addColorStop(0, "rgba(255,244,200,0.95)");
      g.addColorStop(0.45, "rgba(255,150,60,0.72)");
      g.addColorStop(1, "rgba(255,90,30,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(255,210,140,${k * 0.8})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * 0.92, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    if (pr.type === "fissure") {
      if (pr.delay > 0) continue;
      const cy = GROUND_BASE;
      if (pr.t2 < 0.28) {
        /* the warning scald on the floor */
        ctx.globalAlpha = 0.30 + 0.55 * Math.abs(Math.sin(now * 24));
        ctx.fillStyle = "rgba(255,140,60,0.85)";
        ctx.beginPath(); ctx.ellipse(pr.x, cy, 20, 6, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        const grow = clamp((pr.t2 - 0.26) / 0.30, 0, 1);
        const fade = clamp((1.0 - pr.t2) / 0.34, 0, 1);
        const h = (152 * Math.sin(grow * Math.PI * 0.75) + 18) * fade;
        drawGlow("flame", 255, 150, 60, pr.x, cy - h * 0.5, h * 1.0, 0.5 * fade);
        const cols = ["rgba(255,90,30,0.72)", "rgba(255,170,60,0.82)", "rgba(255,240,190,0.92)"];
        for (let l = 0; l < 3; l++) {
          const wB = 18 * (0.72 - l * 0.18);
          const lh = h * (1 - l * 0.16);
          const wob = Math.sin(now * (16 + l * 5) + pr.x * 0.1) * 3;
          ctx.fillStyle = cols[l];
          ctx.beginPath();
          ctx.moveTo(pr.x - wB, cy);
          ctx.quadraticCurveTo(pr.x - wB * 0.5, cy - lh * 0.6, pr.x + wob * 0.4, cy - lh);
          ctx.quadraticCurveTo(pr.x + wB * 0.5, cy - lh * 0.6, pr.x + wB, cy);
          ctx.closePath(); ctx.fill();
        }
      }
      continue;
    }
    if (pr.type === "shock") {
      const k = pr.life / 2.0;
      const h = 30 + Math.sin(now * 22) * 4;
      ctx.globalAlpha = clamp(k * 2.2, 0, 1) * 0.9;
      const g = ctx.createLinearGradient(0, pr.y - h, 0, pr.y + pr.h);
      g.addColorStop(0, "rgba(255,180,90,0)");
      g.addColorStop(0.5, "rgba(255,150,70,0.85)");
      g.addColorStop(1, "rgba(255,220,150,0.95)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(pr.x - 4, pr.y + pr.h);
      ctx.quadraticCurveTo(pr.x + pr.w / 2, pr.y - h, pr.x + pr.w + 4, pr.y + pr.h);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.save(); ctx.translate(pr.x + pr.w / 2, pr.y + pr.h / 2); ctx.rotate(pr.rot || 0);
    if (pr.type === "bomb") {
      ctx.fillStyle = "#1b1f28";
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = "#2c333f";
      ctx.beginPath(); ctx.arc(-2.4, -2.6, 3.1, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#6b5a44"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(3.4, -6); ctx.quadraticCurveTo(10, -12, 7, -17); ctx.stroke();
      const sp = 0.6 + 0.4 * Math.sin(now * 30);
      drawGlow("flame", 255, 180, 90, 7, -18, 11 * sp, 0.7);
      ctx.fillStyle = "#ffd27a";
      ctx.beginPath(); ctx.arc(7, -18, 2.2 * sp + 0.8, 0, TAU); ctx.fill();
    } else if (pr.type === "rock") {
      ctx.fillStyle = "#3b3038";
      ctx.beginPath();
      ctx.moveTo(-14, 4); ctx.lineTo(-9, -12); ctx.lineTo(5, -15); ctx.lineTo(15, -2);
      ctx.lineTo(10, 12); ctx.lineTo(-6, 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,170,90,0.30)";
      ctx.beginPath(); ctx.moveTo(-9, -12); ctx.lineTo(5, -15); ctx.lineTo(2, -6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,140,70,0.55)"; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-4, -8); ctx.lineTo(3, -2); ctx.moveTo(2, 4); ctx.lineTo(8, 8);
      ctx.stroke();
    } else if (pr.type === "crescent") {
      const dir = Math.sign(pr.vx) || 1;
      ctx.scale(dir, 1);
      const hh = pr.h * 0.5 + 8;
      drawGlow("crescent", 150, 225, 255, 4, 0, 46, 0.55 * clamp(pr.life / 0.3, 0, 1));
      ctx.globalAlpha = clamp(pr.life / 0.3, 0, 1);
      ctx.save();
      ctx.rotate(-0.35);
      ctx.fillStyle = "#dff4ff";
      ctx.beginPath();
      ctx.moveTo(16, -hh);
      ctx.quadraticCurveTo(-16, 0, 16, hh);
      ctx.quadraticCurveTo(2, 0, 16, -hh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(13, -hh * 0.72);
      ctx.quadraticCurveTo(-4, 0, 13, hh * 0.72);
      ctx.quadraticCurveTo(6, 0, 13, -hh * 0.72);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (pr.type === "arrow" && pr.friendly) {
      /* the bow's arrow keeps its own shape — shaft, steel head, fletching —
         tinted cyan, so a scavenged bow never reads as a thrown blade. The
         flight angle is already in `pr.rot` (set in `updateProjs`), and the
         sprite is mirrored about its shaft, so it reads correctly either way */
      drawGlow("dot", 150, 225, 255, 0, 0, 15, 0.30);
      ctx.strokeStyle = "rgba(196,232,255,0.85)"; ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = "#e8f8ff";
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(3.6, -3.3); ctx.lineTo(5.2, 0); ctx.lineTo(3.6, 3.3);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(150,212,255,0.9)"; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(-9, 0); ctx.lineTo(-12.6, -3.6);
      ctx.moveTo(-9, 0); ctx.lineTo(-12.6, 3.6);
      ctx.stroke();
    } else if (pr.type === "shuriken") {
      const col = "#cfe9ff";
      ctx.fillStyle = col;
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2.6, -2.4); ctx.lineTo(0, -8.5); ctx.lineTo(-2.6, -2.4); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#0a0e19"; ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.3; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "#c9a2a2"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
      ctx.fillStyle = "#ffd27a";
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -3.4); ctx.lineTo(3, 3.4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#8a6c6c"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-12, -4); ctx.moveTo(-9, 0); ctx.lineTo(-12, 4); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawGates() {
  worldT(1, 1);
  for (let i = 0; i < LEVELS.length - 1; i++) {
    if (i + 1 !== progress.level || LEVELS[i].boss) continue;
    const gx = LEVELS[i].end;
    if (gx < cam.x - 260 || gx > cam.x + VW + 260) continue;
    drawTorii(gx, groundTopAt(gx) ?? GROUND_BASE, 1, false);
  }
  if (!isEndless() && !hasChosen(progress.level) && choiceDef(progress.level)) {
    const cx = choiceEndX(curLevel());
    if (cx > cam.x - 320 && cx < cam.x + VW + 320) drawTorii(cx, groundTopAt(cx) ?? GROUND_BASE, 1.15, false);
  }
  if (!progress.cleared && isBossLevel()) {
    const ax = arenaX0();
    if (ax > cam.x - 320 && ax < cam.x + VW + 320) drawTorii(ax, groundTopAt(ax) ?? GROUND_BASE, 1.7, true);
  }
}

function drawTorii(x, gy, s, evil) {
  const th = 156 * s, half = 74 * s, pw = 15 * s;
  const pillar = evil ? "#3a2148" : "#8f2b26";
  const pillarLit = evil ? "#5b356e" : "#c3413a";
  const beam = evil ? "#241430" : "#6f1f1c";
  ctx.save();
  ctx.translate(x, gy);

  /* base glow */
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 150 * s);
  gl.addColorStop(0, evil ? "rgba(200,90,255,0.16)" : "rgba(255,190,110,0.20)");
  gl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.ellipse(0, -6 * s, 150 * s, 150 * s, 0, 0, TAU); ctx.fill();

  /* ward curtain */
  const pulse = 0.5 + 0.5 * Math.sin(now * 2.1);
  const cg = ctx.createLinearGradient(0, -th, 0, 0);
  const a0 = (evil ? 0.20 : 0.15) + pulse * 0.09;
  cg.addColorStop(0, evil ? `rgba(190,110,255,${a0 * 0.4})` : `rgba(255,210,130,${a0 * 0.4})`);
  cg.addColorStop(0.6, evil ? `rgba(160,80,240,${a0})` : `rgba(255,196,110,${a0})`);
  cg.addColorStop(1, evil ? "rgba(120,50,200,0.02)" : "rgba(255,170,80,0.02)");
  ctx.fillStyle = cg;
  ctx.fillRect(-half + pw * 0.5, -th + 22 * s, half * 2 - pw, th - 22 * s);

  /* curtain scan lines */
  ctx.globalAlpha = 0.14 + pulse * 0.09;
  ctx.strokeStyle = evil ? "#d9a4ff" : "#ffe4a8";
  ctx.lineWidth = 1.2 * s;
  for (let i = 0; i < 6; i++) {
    const yy = -th + 22 * s + ((now * 26 * s + i * 30 * s) % (th - 22 * s));
    ctx.beginPath(); ctx.moveTo(-half + pw * 0.5, yy); ctx.lineTo(half - pw * 0.5, yy); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* pillars */
  ctx.fillStyle = pillar;
  ctx.fillRect(-half - pw / 2, -th, pw, th);
  ctx.fillRect(half - pw / 2, -th, pw, th);
  ctx.fillStyle = pillarLit;
  ctx.fillRect(-half - pw / 2, -th, pw * 0.34, th);
  ctx.fillRect(half - pw / 2, -th, pw * 0.34, th);

  /* lintel (kasagi) — slight upward curve at the ends */
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(-half - 30 * s, -th - 4 * s);
  ctx.quadraticCurveTo(0, -th - 20 * s, half + 30 * s, -th - 4 * s);
  ctx.lineTo(half + 30 * s, -th + 13 * s);
  ctx.quadraticCurveTo(0, -th - 3 * s, -half - 30 * s, -th + 13 * s);
  ctx.closePath(); ctx.fill();

  /* nuki */
  ctx.fillStyle = pillar;
  ctx.fillRect(-half - 14 * s, -th + 30 * s, half * 2 + 28 * s, 11 * s);
  if (evil) {
    /* a spectral oni face looming in the ward curtain */
    const ey = -th * 0.64;
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    for (const sx of [-1, 1]) {
      ctx.fillStyle = "#ff5a5a";
      ctx.beginPath(); ctx.ellipse(sx * 18 * s, ey, 9 * s, 4.2 * s, sx * 0.3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 0.42 + pulse * 0.30;
    ctx.strokeStyle = "#f0a8ff"; ctx.lineWidth = 3.4 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-40 * s, ey - 17 * s); ctx.lineTo(-9 * s, ey - 7 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40 * s, ey - 17 * s); ctx.lineTo(9 * s, ey - 7 * s); ctx.stroke();
    const my = -th * 0.30;
    ctx.fillStyle = "#1b0722";
    ctx.beginPath(); ctx.ellipse(0, my, 46 * s, 16 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#f0dff8";
    for (let i = -2; i <= 2; i++) {
      const fx = i * 15 * s;
      ctx.beginPath(); ctx.moveTo(fx - 5 * s, my - 13 * s); ctx.lineTo(fx, my + 4 * s); ctx.lineTo(fx + 5 * s, my - 13 * s); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  /* talisman plaque */
  ctx.fillStyle = evil ? "#c8b6d8" : "#e8d9a8";
  ctx.fillRect(-7 * s, -th + 44 * s, 14 * s, 30 * s);
  ctx.fillStyle = evil ? "#5a2a6e" : "#a5391f";
  ctx.fillRect(-3.4 * s, -th + 50 * s, 6.8 * s, 18 * s);
  ctx.restore();
}

function drawPickups() {
  worldT(1, 1);
  for (const pk of pickups) {
    const bob = Math.sin(pk.t * 3 + pk.x * 0.1) * 3;
    ctx.save(); ctx.translate(pk.x + 8, pk.y + 8 + bob);
    if (pk.kind === "scroll") {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 22);
      g.addColorStop(0, "rgba(255,220,120,0.35)"); g.addColorStop(1, "rgba(255,200,80,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e8d9a8"; ctx.fillRect(-7, -8, 14, 16);
      ctx.fillStyle = "#b8433f"; ctx.fillRect(-7, -9.5, 14, 3); ctx.fillRect(-7, 6.5, 14, 3);
      ctx.strokeStyle = "rgba(120,90,60,0.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(4, -4); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();
    } else if (pk.kind === "heart") {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 22);
      g.addColorStop(0, "rgba(255,110,130,0.4)"); g.addColorStop(1, "rgba(255,80,110,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ff5a75";
      ctx.beginPath();
      ctx.moveTo(0, 7);
      ctx.bezierCurveTo(-11, -2, -7, -11, 0, -5);
      ctx.bezierCurveTo(7, -11, 11, -2, 0, 7);
      ctx.fill();
    } else if (pk.kind === "weapon") {
      const tint = WEAPON_TINT[pk.id] || "#ffd479";
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 24);
      g.addColorStop(0, "rgba(255,225,160,0.34)"); g.addColorStop(1, "rgba(255,200,90,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.fill();
      ctx.save();
      ctx.rotate(-0.55 + Math.sin(pk.t * 1.6) * 0.08);
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = tint; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      drawWeaponGlyph(pk.id, 1.05);
      ctx.restore();
    } else {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 20);
      g.addColorStop(0, "rgba(180,230,255,0.35)"); g.addColorStop(1, "rgba(140,210,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
      ctx.fillStyle = "#d6ecff";
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2.2, -2); ctx.lineTo(0, -7.5); ctx.lineTo(-2.2, -2); ctx.closePath(); ctx.fill(); }
    }
    ctx.restore();
  }
}

function drawForeground() {
  /* falling sakura petals (screen-space, parallax) */
  const par = 1.35;
  worldT(par, 1);
  const T = 900;
  const i0 = Math.floor(cam.x * par / T) - 1, i1 = Math.floor((cam.x * par + VW) / T) + 1;
  for (let i = i0; i <= i1; i++) {
    for (let k = 0; k < 5; k++) {
      const h1 = hash(i * 17.3 + k * 5.1), h2 = hash(i * 41.9 + k * 2.7);
      const x = i * T + h1 * T + Math.sin(now * 0.6 + k) * 20;
      const y = ((h2 * 900 + now * (14 + k * 7)) % 620) - 60;
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = k % 2 ? "#c98fae" : "#b57d9c";
      ctx.save(); ctx.translate(x, cam.y + y); ctx.rotate(now * 1.2 + k);
      ctx.beginPath(); ctx.ellipse(0, 0, 2.4, 1.4, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  /* vignette */
  worldT(0, 0);
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 1.0);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, VW + 40, VH + 40);
}

/* ------------------------------------------------------------------- UI   */
let now = 0;
function hintText() {
  if (game.hintMsg) return game.hintMsg;
  let h = "MOVE  ·  JUMP  ·  SLASH  ·  RAGE";
  if (progress.hasChakra) h += "  ·  CHAKRA";
  h += "  ·  DASH";
  if (weaponOptionCount() > 1) h += lastTouch ? "  ·  TAP A WEAPON SLOT" : "  ·  Q: WEAPON";
  return h;
}
function drawUI() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const u = clamp(Math.min(W, H) / 330, 0.72, 1.7);
  const pad = 14 * u;
  /* HUD insets: keep every readout clear of a notch / rounded corner */
  const padX = pad + SAFE.l, padY = pad + SAFE.t, rightX = W - pad - SAFE.r, botY = H - SAFE.b;

  /* level progress bar along the very top edge */
  if (!isEndless()) {
    const L = curLevel();
    const k = clamp((P.x + P.w * 0.5 - L.start) / (L.end - L.start), 0, 1);
    ctx.fillStyle = "rgba(140,170,210,0.16)";
    ctx.fillRect(SAFE.l, SAFE.t, W - SAFE.l - SAFE.r, 3);
    const lg = ctx.createLinearGradient(SAFE.l, 0, W - SAFE.r, 0);
    lg.addColorStop(0, "#ffd479");
    lg.addColorStop(1, "#ff9a5a");
    ctx.fillStyle = lg;
    ctx.fillRect(SAFE.l, SAFE.t, (W - SAFE.l - SAFE.r) * k, 3);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(Math.max(SAFE.l, SAFE.l + (W - SAFE.l - SAFE.r) * k - 2), SAFE.t, 2, 3);
  }

  /* hero health bar — wounds slow the run and shorten the jump */
  {
    const bw = 118 * u, bh = 9 * u;
    const bx = padX + 8 * u, by = padY + 5 * u;
    const hpf = clamp(P.hp / Math.max(1, P.maxHp), 0, 1);
    ctx.fillStyle = "rgba(20,10,14,0.75)";
    ctx.fillRect(bx - 2 * u, by - 2 * u, bw + 4 * u, bh + 4 * u);
    ctx.fillStyle = "rgba(90,40,50,0.7)";
    ctx.fillRect(bx, by, bw, bh);
    const hg = ctx.createLinearGradient(0, by, 0, by + bh);
    if (hpf < 0.3) { hg.addColorStop(0, "#ff7a5a"); hg.addColorStop(1, "#c81a1a"); }
    else { hg.addColorStop(0, "#7de08a"); hg.addColorStop(1, "#2e9e52"); }
    ctx.fillStyle = hg;
    ctx.fillRect(bx, by, bw * hpf, bh);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(bx, by, bw * hpf, 1.4 * u);
    ctx.strokeStyle = "rgba(255,220,190,0.4)"; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = P.merged ? "#ffb46a" : "#dbe8f8";
    ctx.font = `700 ${Math.round(9.5 * u)}px system-ui, sans-serif`;
    ctx.fillText(Math.ceil(P.hp) + "/" + Math.round(P.maxHp) + (P.merged ? " · FOX-FIRE" : ""), bx + bw + 7 * u, by + bh / 2);
    ctx.textBaseline = "alphabetic";
    if (PET.active && !PET.sacrificed) {
      const pbw = 64 * u, pbh = 5 * u;
      const pbx = bx, pby = by + bh + 6 * u;
      const ppf = clamp(PET.hp / Math.max(1, PET.maxHp), 0, 1);
      ctx.fillStyle = "rgba(20,12,8,0.75)";
      ctx.fillRect(pbx - 1.5 * u, pby - 1.5 * u, pbw + 3 * u, pbh + 3 * u);
      ctx.fillStyle = "rgba(90,50,30,0.7)";
      ctx.fillRect(pbx, pby, pbw, pbh);
      ctx.fillStyle = PET.mode === "guardian" ? "#ff8a3c" : "#ffce6a";
      ctx.fillRect(pbx, pby, pbw * ppf, pbh);
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,220,170,0.85)";
      ctx.font = `${Math.round(8.5 * u)}px system-ui, sans-serif`;
      ctx.fillText(PET.mode === "guardian" ? "FOX " + Math.ceil(PET.hp) : "FOX", pbx + pbw + 6 * u, pby + pbh / 2);
      ctx.textBaseline = "alphabetic";
    }
  }

  /* companion status pip */
  {
    const ready = PET.atkCd <= 0 && PET.guardCd <= 0;
    const cxp = padX + 140 * u, cyp = padY + 9 * u;
    const gl = ready ? 0.7 + 0.3 * Math.sin(now * 4) : 0.3;
    ctx.save(); ctx.translate(cxp, cyp); ctx.scale(u, u);
    ctx.globalAlpha = 0.35; ctx.strokeStyle = ready ? "#ffce6a" : "#7a8296"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 8.6, 0, TAU); ctx.stroke();
    ctx.globalAlpha = gl;
    ctx.fillStyle = ready ? "#ffce6a" : "#7a8296";
    ctx.beginPath();
    ctx.moveTo(-6.2, -0.8);
    ctx.lineTo(-5.0, -7.6);
    ctx.lineTo(-1.4, -3.2);
    ctx.lineTo(1.6, -3.2);
    ctx.lineTo(5.2, -7.6);
    ctx.lineTo(6.2, -0.8);
    ctx.quadraticCurveTo(6.2, 4.2, 0, 4.2);
    ctx.quadraticCurveTo(-6.2, 4.2, -6.2, -0.8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* kenki (focus) meter — fills from sword hits and parries; a full bar turns your
     next slash into a guard-breaking KAGE-GIRI */
  {
    const bw = 104 * u, bh = 7 * u;
    const bx = padX + 140 * u + 30 * u, by = padY + 9 * u - bh / 2 + (PET.active && !PET.sacrificed ? 14 * u : 0);
    const kf = clamp(P.focus / CFG.focusMax, 0, 1);
    const full = kf >= 1;
    const pulse = full ? 0.5 + 0.5 * Math.sin(now * 7) : 0;
    if (full) drawGlow("focusFull", 165, 235, 255, bx + bw / 2, by + bh / 2, bw * 0.62, 0.26 + 0.20 * pulse);
    ctx.fillStyle = "rgba(120,150,190,0.20)";
    ctx.fillRect(bx, by, bw, bh);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (full) { g.addColorStop(0, "#eafaff"); g.addColorStop(1, "#8fe4ff"); }
    else { g.addColorStop(0, "#3f8fd0"); g.addColorStop(1, "#8fe4ff"); }
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * kf, bh);
    ctx.strokeStyle = full ? "rgba(235,250,255,0.95)" : "rgba(150,190,230,0.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    if (full) {
      /* a scavenged weapon has no blade to spend the kenki on, so the bar
         simply stays charged until the katana comes back */
      const armed = !!(P.weapon && WEAPONS[P.weapon.id]);
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.globalAlpha = 0.55 + 0.45 * pulse;
      ctx.fillStyle = "#e6f8ff";
      ctx.font = `${Math.round(9.5 * u)}px system-ui, sans-serif`;
      ctx.fillText(armed ? "KENKI HELD" : "KAGE-GIRI READY", bx + bw + 7 * u, by + bh / 2);
      ctx.globalAlpha = 1;
      ctx.textBaseline = "alphabetic";
    }
  }

  /* level label */
  {
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = `${Math.round(10 * u)}px system-ui, sans-serif`;
    if (isEndless()) {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = "#ffd479";
      ctx.fillText("ENDLESS NIGHT  ·  BEST " + Math.floor(game.best), padX, padY + (PET.active && !PET.sacrificed ? 52 : 24) * u);
    } else {
      const L = curLevel();
      ctx.globalAlpha = 0.62;
      ctx.fillStyle = "#9fb6d6";
      ctx.fillText("LEVEL " + L.roman, padX, padY + (PET.active && !PET.sacrificed ? 52 : 24) * u);
      ctx.globalAlpha = 0.42;
      ctx.fillText(L.name, padX + 52 * u, padY + (PET.active && !PET.sacrificed ? 52 : 24) * u);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";
  }

  /* ryō balance */
  if (SAVE.ryo > 0 || (SAVE.stats.ryo || 0) > 0) {
    const fl = clamp(game.ryoFlash || 0, 0, 1);
    const rcy = padY + 44 * u;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.globalAlpha = 0.55 + 0.45 * fl;
    ctx.fillStyle = "#ffd479";
    ctx.beginPath(); ctx.arc(padX + 5 * u, rcy, 4.4 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(8,12,22,0.92)";
    ctx.fillRect(padX + 3.3 * u, rcy - 1.1 * u, 3.4 * u, 2.2 * u);
    ctx.fillStyle = fl > 0.35 ? "#fff3cf" : "#e8d5a8";
    ctx.font = `700 ${Math.round(11 * u)}px "Shippori Mincho", serif`;
    ctx.fillText(SAVE.ryo.toLocaleString(), padX + 14 * u, rcy);
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";
  }

  /* the chosen weapon (or the katana, if you stowed the haul), plus the swings
     left in it — the same choice the weapon bar above the jump button makes */
  const hw = (P.weapon && WEAPONS[P.weapon.id]) ? WEAPONS[P.weapon.id] : null;
  if (hw || ARSENAL.length) {
    const wid = hw ? hw.id : KATANA_GLYPH;
    const tint = WEAPON_TINT[wid] || "#ffd479";
    const wy = padY + (SAVE.ryo > 0 || (SAVE.stats.ryo || 0) > 0 ? 62 : 44) * u;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.save();
    ctx.translate(padX + 6 * u, wy);
    ctx.globalAlpha = 0.95;
    drawWeaponGlyph(wid, 0.62 * u);
    ctx.restore();
    ctx.globalAlpha = 0.72 + 0.28 * clamp(P.wpFlash * 3, 0, 1);
    ctx.fillStyle = "#dbe8f8";
    ctx.font = `700 ${Math.round(9.5 * u)}px system-ui, sans-serif`;
    ctx.fillText((hw ? hw.name : "KATANA") + (weaponOptionCount() > 1 ? "   " + (WSEL + 1) + "/" + weaponOptionCount() : ""), padX + 27 * u, wy - 4 * u);
    /* remaining uses as pips */
    if (hw) {
      const n = Math.min(hw.uses, 12), px0 = padX + 27 * u;
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = i < P.weapon.uses ? tint : "rgba(150,170,195,0.3)";
        ctx.fillRect(px0 + i * 4.4 * u, wy + 3 * u, 3.2 * u, 3.2 * u);
      }
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = "alphabetic";
  }

  /* score */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = "right"; ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(220,235,255,0.95)";
  ctx.font = `${Math.round(20 * u)}px "Shippori Mincho", serif`;
  ctx.fillText(String(Math.floor(game.score)), rightX, padY - 2 * u);
  ctx.font = `${Math.round(10 * u)}px system-ui, sans-serif`;
  ctx.fillStyle = "rgba(150,175,210,0.8)";
  ctx.fillText("BEST " + Math.floor(Math.max(game.best, game.score)), rightX, padY + 22 * u);

  /* combo */
  if (P.combo > 1) {
    ctx.textAlign = "center";
    const a = clamp(P.comboT / 1.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffd67a";
    ctx.font = `${Math.round(22 * u)}px "Shippori Mincho", serif`;
    ctx.fillText("x" + P.combo, W / 2, padY + 4 * u);
    ctx.globalAlpha = 1;
  }

  /* hint */
  if (game.hint > 0) {
    ctx.globalAlpha = clamp(game.hint / 1.2, 0, 1) * 0.9;
    ctx.textAlign = "center"; ctx.fillStyle = "#cfe3ff";
    ctx.font = `${Math.round(12 * u)}px system-ui, sans-serif`;
    ctx.fillText(hintText(), W / 2, botY - 22 * u);
    ctx.globalAlpha = 1;
  }

  /* shuriken ammo pips near throw button */
  const tb = BTNS[2];
  if (tb && !tb.locked) {
    ctx.textAlign = "center";
    ctx.fillStyle = P.shu > 0 ? "#cfe9ff" : "#6b7a92";
    ctx.font = `${Math.round(13 * u)}px system-ui, sans-serif`;
    ctx.fillText("×" + P.shu, tb.cx, tb.cy - tb.r - 12 * u);
  }

  drawWeaponBar(u);
  drawButtons(u);
  if (boss) drawBossBar();

  /* mute */
  ctx.save();
  ctx.translate(MUTE.x, MUTE.y);
  ctx.scale(MUTE.r / 16, MUTE.r / 16);
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = "#cfe3ff"; ctx.fillStyle = "#cfe3ff"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, -3); ctx.lineTo(-3, -3); ctx.lineTo(2, -8); ctx.lineTo(2, 8); ctx.lineTo(-3, 3); ctx.lineTo(-7, 3);
  ctx.closePath(); ctx.fill();
  if (A.muted) {
    ctx.beginPath(); ctx.moveTo(5, -6); ctx.lineTo(11, 6); ctx.moveTo(11, -6); ctx.lineTo(5, 6); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(3, 0, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(3, 0, 10, -0.8, 0.8); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  /* joystick */
  if (stick) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const dl = Math.hypot(dx, dy);
    const cl = Math.min(dl, stick.base);
    const kx = stick.ox + (dl ? dx / dl * cl : 0), ky = stick.oy + (dl ? dy / dl * cl : 0);
    ctx.strokeStyle = "rgba(160,200,240,0.22)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, stick.base, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(190,225,255,0.28)";
    ctx.beginPath(); ctx.arc(kx, ky, stick.base * 0.42, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(210,235,255,0.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kx, ky, stick.base * 0.42, 0, TAU); ctx.stroke();
  } else {
    ctx.strokeStyle = "rgba(160,200,240,0.10)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(STICK_IDLE.x, STICK_IDLE.y, 46 * u, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(160,200,240,0.16)";
    ctx.beginPath(); ctx.arc(STICK_IDLE.x, STICK_IDLE.y, 14 * u, 0, TAU); ctx.fill();
  }

  /* pop texts */
  ctx.setTransform(dpr * S, 0, 0, dpr * S, -cam.x * S * dpr, -cam.y * S * dpr);
  ctx.textAlign = "center";
  for (const t of game.popTexts) {
    const k = 1 - t.t / t.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = "#ffe9a0";
    ctx.font = `700 15px "Shippori Mincho", serif`;
    ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawWeaponBar(u) {
  const slots = weaponBarSlots();
  if (!slots.length) return;
  const s = slots[0].w;
  const last = slots[slots.length - 1];
  ctx.save();
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.font = `700 ${Math.round(8.5 * u)}px system-ui, sans-serif`;
  const lw = ctx.measureText("WEAPON").width;
  const px0 = slots[0].x - 9 * u - lw - 6 * u, py0 = slots[0].y - 5 * u;
  const pw = (last.x + s + 5 * u) - px0, ph = s + 10 * u;
  /* a dim plate keeps the choice readable over any backdrop */
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(6,10,20,0.34)";
  roundRect(ctx, px0, py0, pw, ph, ph * 0.42); ctx.fill();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = "#cfe3ff";
  ctx.fillText("WEAPON", slots[0].x - 9 * u, slots[0].y + s / 2 + 0.5);
  ctx.restore();
  ctx.globalAlpha = 1;
  for (const sl of slots) {
    const i = sl.i;
    const w = i > 0 ? ARSENAL[i - 1] : null;
    const def = w ? WEAPONS[w.id] : null;
    const act = i === WSEL;
    ctx.save();
    ctx.translate(sl.x + s / 2, sl.y + s / 2);
    ctx.globalAlpha = act ? 0.34 : 0.15;
    ctx.fillStyle = "#8fc4ff";
    roundRect(ctx, -s / 2, -s / 2, s, s, s * 0.30); ctx.fill();
    ctx.globalAlpha = act ? 0.95 : 0.40;
    ctx.strokeStyle = act ? "#e2f2ff" : "#a9c8e8";
    ctx.lineWidth = act ? 2 : 1.2;
    roundRect(ctx, -s / 2, -s / 2, s, s, s * 0.30); ctx.stroke();
    ctx.globalAlpha = def ? (act ? 1 : 0.62) : (act ? 0.95 : 0.55);
    ctx.fillStyle = "#e8f4ff";
    drawWeaponGlyph(def ? def.id : KATANA_GLYPH, s / 44);
    if (def) {
      const frac = clamp(w.uses / Math.max(1, def.uses), 0, 1);
      ctx.globalAlpha = act ? 1 : 0.65;
      ctx.fillStyle = WEAPON_TINT[def.id] || "#ffd479";
      roundRect(ctx, -s / 2 + 3, s / 2 - 5.4, (s - 6) * frac, 2.4, 1.2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawButtons(u) {
  const icons = {
    jump: (c, r) => { c.beginPath(); c.moveTo(0, -r * 0.5); c.lineTo(r * 0.55, r * 0.15); c.lineTo(r * 0.24, r * 0.15); c.lineTo(r * 0.24, r * 0.5); c.lineTo(-r * 0.24, r * 0.5); c.lineTo(-r * 0.24, r * 0.15); c.lineTo(-r * 0.55, r * 0.15); c.closePath(); c.fill(); },
    slash: (c, r) => { c.beginPath(); c.moveTo(-r * 0.45, r * 0.55); c.lineTo(r * 0.35, -r * 0.55); c.lineTo(r * 0.5, -r * 0.38); c.lineTo(-r * 0.28, r * 0.7); c.closePath(); c.fill(); c.beginPath(); c.arc(-r * 0.48, r * 0.6, r * 0.14, 0, TAU); c.fill(); },
    tp: (c, r) => { for (let i = 0; i < 4; i++) { c.rotate(Math.PI / 2); c.beginPath(); c.moveTo(0, 0); c.lineTo(r * 0.3, -r * 0.28); c.lineTo(0, -r * 0.95); c.lineTo(-r * 0.3, -r * 0.28); c.closePath(); c.fill(); } },
    dash: (c, r) => { for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(r * 0.1 + i * r * 0.34, -r * 0.5); c.lineTo(r * 0.55 + i * r * 0.34, 0); c.lineTo(r * 0.1 + i * r * 0.34, r * 0.5); c.closePath(); c.fill(); } },
    punch: (c, r) => { c.fillRect(-r * 0.42, -r * 0.2, r * 0.84, r * 0.5); c.beginPath(); c.arc(r * 0.1, -r * 0.32, r * 0.34, 0, TAU); c.fill(); },
    kick: (c, r) => { c.beginPath(); c.moveTo(-r * 0.5, -r * 0.4); c.lineTo(r * 0.1, -r * 0.4); c.lineTo(r * 0.1, r * 0.1); c.lineTo(r * 0.55, r * 0.1); c.lineTo(r * 0.55, r * 0.5); c.lineTo(-r * 0.2, r * 0.5); c.lineTo(-r * 0.2, r * 0.05); c.lineTo(-r * 0.5, r * 0.05); c.closePath(); c.fill(); },

  };

    ctx.strokeStyle = "#bcdcff"; ctx.lineWidth = 1.5;

    ctx.fillStyle = "#e8f4ff";

}
