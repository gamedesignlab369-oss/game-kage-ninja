/* ----------------------------------------------------------------- world -- */
const GROUND_BASE = 330;
const KILL_Y = 660;

function addSolid(x, y, w, h, oneWay) { solids.push({ x, y, w, h, oneWay: !!oneWay, seed: hash(x * 0.013) }); }
function groundTopAt(x) {
  let best = null;
  for (const s of solids) if (!s.oneWay && x >= s.x && x <= s.x + s.w) if (best === null || s.y < best) best = s.y;
  return best;
}

  for (let d = 0; d < 520; d += 6) {
    const a = groundTopAt(x - d);
    if (a !== null) return { x: x - d, y: a };
    const b = groundTopAt(x + d);
    if (b !== null) return { x: x + d, y: b };

}

function addDecor(kind, x, y) { decor.push({ kind, x, y, s: 0.82 + hash(x * 0.7) * 0.5, f: hash(x * 1.3) }); }

const SEG_W = 44;
let groundLeft = 0, gapLeft = 0, runIdx = 0;

function baseTerrainY(x) {

function genStep() {
  /* ---- boss arena: a long flat killing floor, no gaps, no wandering mobs ---- */
  if (isBossLevel() && genX >= arenaX0() && genX < arenaX1()) {
    const w = Math.min(SEG_W, arenaX1() - genX);
    const top = Math.round(GROUND_BASE / 3) * 3;
    addSolid(genX, top, w + 1, 420, false);
    const nearSeal = genX < arenaX0() + 130 || genX > arenaX1() - 160;
    if (!nearSeal) {
      if (genX % 176 < SEG_W && !decor.some(q => q.kind === "brazier" && Math.abs(q.x - genX) < 170)) addDecor("brazier", genX + 22, top);
      if (genX % 616 < SEG_W) addDecor(wpick(decoPool()), genX + 34, top);
    }

  }

  const d = difficultyAt(genX);

  if (groundLeft <= 0) {

  const w = Math.min(SEG_W, groundLeft);

  const gcx = genX + w / 2;

  if (nearGate) { groundLeft -= w; genX += w; return; }

  if (!easy) {
    const nearEdge = groundLeft > 0 && groundLeft < 90;
    if (groundLeft > 60 && Math.random() < 0.016 + 0.03 * d) {
      const sx = genX + rnd(0, Math.max(1, w - 40));
      const count = ri(1, 1 + Math.round(2.4 * d));
      const sw = 15 * count + 8;
      if (!solids.some(s => s.spikes && Math.abs(s.x - sx) < 120)) {

      }
    }

      const t = wpick(enemyPool());
      if (!enemies.some(e => Math.abs(e.x - genX) < 220) && !nearEdge) {

        if (t === "shield" && !game.taughtShield) {

    if (!isEndless() && themeKey() === "ember" && !nearEdge && genX - lastRefugeX > CFG.lavaRefuge && groundLeft > 110) {

function genAhead() {
  const limit = cam.x + VW + 1100;
  let guard = 0;
  while (genX < limit && guard++ < 400) genStep();
}

/* -------------------------------------------------------------- set pieces -- */
/* One land-defining mechanic per land, all three placed by genStep() and driven
   from updateSetpieces():
     I  rice  — flooded paddies you wade through (`water[]`), with piranhas
                lurking under the surface (a `piranha` hazard).
     IV snow  — a frozen chasm crossed by an ice bridge of one-way slabs that
                crack underfoot (`solids` flagged `ice`, refrozen by updateIce).
     V  ember — a tide of lava that climbs out of the ground and back on a cycle
                (`lava`), healing nothing and harming anything on the floor.
   None of it touches the boss arena. */
let water = [];
let chasms = [];
let pits = [];          /* the ember land's gaps — the tide pools visibly in them */

const lava = { t: 0, k: 0 };
/* When a gate is cleared mid-run the strip is not rebuilt (that would teleport

   change of land would leave a step in the floor. */
let seamEase = null;
function groundTopFor(x) {

    y = lerp(seamEase.y, y, smoothstep(k));

  decor = decor.filter(d => d.x < x);
  enemies = enemies.filter(e => e.x < x);
  hazards = hazards.filter(h => (h.homeX !== undefined ? h.homeX : h.x) < x);
  pickups = pickups.filter(p => p.x < x);
  water = water.filter(w => w.x1 < x);
  chasms = chasms.filter(c => c.x1 < x);
  pits = pits.filter(p => p.x1 < x);

  seamEase = { x0: seam, x1: seam + CFG.seamBlend, y: y0 === null ? baseTerrainY(seam) : y0 };

  lastIceX = -9999; lastRefugeX = seam - 9999; lastPaddyX = seam - 9999;

}

function waterAt(x) {
  for (const w of water) if (x >= w.x0 && x <= w.x1) return w;
  return null;
}

function waterTopAt(x) { return groundTopFor(x) - CFG.paddyInset; }

/* the frozen chasm: carve a wide gap, then lay one continuous ice shelf across
   it, cut into segments that each crack and drop a beat after you step on them.
   The segments are ordinary `crumble` solids flagged `ice`, so updateCrumble,
   moveCollide and drawGround already know what to do — and being solid (not
   one-way) the auto step-up keeps small rises from jamming a runner. */
function makeIceBridge(x) {
  gapLeft = CFG.chasmWidth;
  chasms.push({ x0: x, x1: x + CFG.chasmWidth, top: groundTopFor(x + CFG.chasmWidth / 2) });
  /* one continuous shelf, cut into segments that each give way a beat after you
     step on them — so the ice collapses right behind you as you run */
  const n = Math.max(3, Math.round(CFG.chasmWidth / CFG.iceStep));
  const segW = CFG.chasmWidth / n;
  for (let i = 0; i < n; i++) {
    const sx = x + i * segW;
    solids.push({ x: sx, y: groundTopFor(sx + segW / 2), w: segW + 0.6, h: 18, oneWay: false, ice: true, crumble: true, shake: 0, seed: hash(sx * 0.013) });
  }

/* shattered ice re-freezes after a beat, so a bridge can never soft-lock a run */
function updateIce() {
  const mx = cam.x - 900;
  for (let i = iceRebuild.length - 1; i >= 0; i--) {
    const r = iceRebuild[i];
    if (r.x < mx) { iceRebuild.splice(i, 1); continue; }
    if (now < r.at) continue;
    const box = { x: r.x, y: r.y, w: r.w, h: r.h };
    if (!DEMO.on && aabb(box, P)) continue;
    let blocked = false;
    for (const e of enemies) if (!e.dead && aabb(box, e)) { blocked = true; break; }
    if (blocked) continue;
    solids.push({ x: r.x, y: r.y, w: r.w, h: 18, oneWay: false, ice: true, crumble: true, shake: 0, seed: hash(r.x * 0.013) });
    iceRebuild.splice(i, 1);
    dust(r.x + r.w / 2, r.y, 7, "#cfeeff");
  }
}

/* -------------------------------------------------------------- the ember tide -- */
/* The surface follows the terrain instead of sitting at one fixed height, so the
   tide pools into the low ground rather than flooding the whole land at once —
   every rise of ground, pillar and ledge is a genuine refuge. At its crest it
   sits CFG.lavaHeight px above the floor, so standing on the floor bites and you
   have to be off it. Damage routes through damagePlayer() without `force`, so a
   dash or i-frames ride it out. */
function lavaOn() { return !isEndless() && themeKey() === "ember"; }
function lavaX0() { return levelStartX(); }
function lavaX1() { return isBossLevel() ? arenaX0() : levelEndX(); }
/* The tide is deepest through the middle of the land and shallows out at both
   ends, so it never has to end in a wall and the boss arena's sunken floor
   (lower than the land around it) is never flooded. `lavaDeep` is how far under
   the ground the tide rests at low water — deep enough to be out of sight, so
   the surface visibly *climbs* through the floor as the surge comes in. */
function lavaSurge(x) {
  return clamp((x - lavaX0()) / 320, 0, 1) * clamp((lavaX1() - x) / 320, 0, 1);
}
function lavaYAt(x) { return groundTopFor(x) + CFG.lavaDeep * (1 - lava.k) - CFG.lavaHeight * lavaSurge(x) * lava.k; }
/* the floor the tide has to top to be seen — there is none in a chasm, where it
   pools openly at any phase. Only the part above the floor is drawn, so the sea
   surfaces out of the ground instead of showing through it. */
function lavaFloor(x) {
  for (const p of pits) if (x > p.x0 && x < p.x1) return null;

/* --------------------------------------------------------------- hazards -- */
/* Obstacles in the ninja's way: buzzsaws, pop-up spike traps, swinging spiked

   `hazards[]`, updates in updateHazards() and draws in drawHazards(). All

  const gy = groundTopAt(x);

  if (type === "saw") {
    h.r = 16; h.homeX = x; h.dir = 1; h.range = CFG.sawRange; h.y = base - h.r; h.rot = h.phase * TAU; h.lastX = x;
  } else if (type === "snap") {
    h.w = 30; h.h = 9; h.x = x - 15; h.y = base - h.h; h.state = "idle"; h.ext = 0; h.struck = false;
  } else if (type === "pendulum") {
    h.L = rnd(150, 186); h.anchorY = base - h.L; h.maxA = rnd(0.82, 1.12);
    h.speed = TAU / CFG.pendulumPeriod; h.bobR = 13; h.ang = 0; h.bx = x; h.by = base;
  } else if (type === "flame") {
    h.w = 22; h.h = 8; h.x = x - 11; h.y = base - h.h; h.col = rnd(68, 92); h.fired = false; h.charge = 0; h.ph = "idle";
  } else if (type === "boulder") {
    h.r = 20; h.y = base - h.r; h.dir = -1; h.state = "perch"; h.vy = 0; h.rot = 0;
  } else if (type === "icicle") {
    h.w = 15; h.h = 30; h.x = x - 7.5; h.anchorY = base - 168; h.y = h.anchorY;
    h.state = "hang"; h.vy = 0; h.rot = 0; h.struck = false; h.len = rnd(26, 38); h.shatter = 0;
  } else if (type === "crusher") {
    h.w = 42; h.h = 30; h.x = x - 21; h.restY = base - h.h; h.hangY = base - 178;
    h.y = h.hangY; h.state = "hang"; h.vy = 0; h.rot = 0; h.struck = false; h.cd = 0;
  } else if (type === "piranha") {
    const wr = waterAt(x);
    h.w = 34; h.h = 20; h.x = x - h.w / 2;
    h.floorY = wr ? waterTopAt(x) + CFG.paddyDepth - 6 : base;
    h.y = h.floorY - h.h; h.state = "lurk"; h.vy = 0; h.struck = false; h.cd = 0; h.facing = 1;

}

function breakBoulder(h) {
  burst(h.x, h.y + h.r, null);
  spark(h.x, h.y, 12, "#b8a488", 260, 0.5);
  for (let i = 0; i < 6; i++) part({ x: h.x + rnd(-14, 14), y: h.y + rnd(-10, 12), vx: rnd(-220, 220), vy: rnd(-250, -60), g: 700, life: rnd(0.5, 0.9), max: 0.9, r: rnd(3, 6), color: "#5b4f3f", t: "dot" });

/* crumbling planks: they hold for a beat, shake, then drop away */
function updateCrumble(dt) {
  const p = P;

  for (const s of solids) {
    if (!s.crumble || s.broken) continue;
    if (s.shake > 0) {
      s.shake -= dt;
      if (s.shake <= 0) {
        s.broken = true; broke = true;
        hazards.push({ type: "fall", x: s.x, y: s.y, w: s.w, h: s.h, vy: 50, rot: 0, t: 0, ice: !!s.ice });
        if (s.ice) { iceRebuild.push({ x: s.x, y: s.y, w: s.w, h: s.h, at: now + CFG.iceRefreeze }); dust(s.x + s.w / 2, s.y, 16, "#cfeeff"); }

      if (s.ice && !game.taughtIce) { game.taughtIce = true; showHint("THE ICE BRIDGE CRACKS AS YOU CROSS — NEVER STOP MOVING", 5); }
      else if (!s.ice && !game.taughtCrumble) { game.taughtCrumble = true; showHint("CRACKING PLANKS GIVE WAY — KEEP MOVING", 3.6); }

function drawHazards() {

    if (h.type === "saw") {
      /* tire track: only where the ground actually exists */
      ctx.fillStyle = "rgba(120,150,190,0.11)";
      for (let dx = -h.range; dx <= h.range; dx += 16) {
        const gy2 = groundTopAt(h.homeX + dx);
        if (gy2 !== null) ctx.fillRect(h.homeX + dx, gy2 - 2, 6, 2);
      }
      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath(); ctx.ellipse(h.x, h.y + h.r - 1, h.r * 0.95, 3.2, 0, 0, TAU); ctx.fill();
      drawGlow("hazard", 255, 90, 60, h.x, h.y, h.r * 3.4, 0.20);
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
      ctx.fillStyle = "#9fb0c2";
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a0 = (i / 9) * TAU, a1 = ((i + 0.5) / 9) * TAU;
        ctx.lineTo(Math.cos(a0) * h.r, Math.sin(a0) * h.r);
        ctx.lineTo(Math.cos(a1) * h.r * 1.34, Math.sin(a1) * h.r * 1.34);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#41505f";
      ctx.beginPath(); ctx.arc(0, 0, h.r * 0.82, 0, TAU); ctx.fill();
      ctx.fillStyle = "#25303c";
      ctx.beginPath(); ctx.arc(0, 0, h.r * 0.34, 0, TAU); ctx.fill();
      ctx.fillStyle = "#c9d6e4";
      ctx.beginPath(); ctx.arc(0, 0, h.r * 0.15, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1b232e";
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + 0.6;
        ctx.beginPath(); ctx.arc(Math.cos(a) * h.r * 0.55, Math.sin(a) * h.r * 0.55, 2.4, 0, TAU); ctx.fill();
      }
      ctx.restore();

    } else if (h.type === "snap") {
      const cx = h.x + h.w / 2, baseY = h.y + h.h;
      if (h.state === "wind") {
        const k = clamp(h.t / CFG.spikeWindup, 0, 1);
        const g = ctx.createLinearGradient(0, baseY - 14, 0, baseY + 6);
        g.addColorStop(0, "rgba(255,120,60,0)");
        g.addColorStop(1, `rgba(255,180,100,${0.6 + 0.35 * k})`);
        ctx.globalAlpha = 0.4 + 0.5 * k * (0.55 + 0.45 * Math.sin(now * 22));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(cx, baseY, 34, 13, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = "rgba(255,190,120,0.9)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(cx, baseY - 1, 34, 13, 0, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      /* plate frame + hazard chevrons */
      ctx.fillStyle = "#2a3442";
      ctx.fillRect(h.x - 3, h.y + 1, h.w + 6, h.h + 3);
      ctx.fillStyle = "#161d27";
      ctx.fillRect(h.x - 1, h.y + 3, h.w + 2, h.h - 1);
      ctx.fillStyle = h.state === "wind" || h.state === "up" ? "rgba(255,180,90,0.95)" : "rgba(255,140,70,0.6)";
      for (let i = 0; i < 3; i++) {
        const cxx = h.x + 7 + i * ((h.w - 14) / 2);
        ctx.beginPath();
        ctx.moveTo(cxx, h.y + 4); ctx.lineTo(cxx + 3, h.y + h.h + 1); ctx.lineTo(cxx + 6, h.y + 4);
        ctx.lineTo(cxx + 4.3, h.y + 4); ctx.lineTo(cxx + 3, h.y + h.h - 1.5); ctx.lineTo(cxx + 1.7, h.y + 4);
        ctx.closePath(); ctx.fill();
      }
      /* spikes — retracted tips stay visible so the trap reads when idle */
      const sw = h.w / 4;
      for (let i = 0; i < 4; i++) {
        const sx = h.x + i * sw + sw / 2, tipY = h.y - 3 - 23 * h.ext;
        ctx.fillStyle = "#c5d2e2";
        ctx.beginPath(); ctx.moveTo(sx - sw * 0.42, h.y + 2); ctx.lineTo(sx, tipY); ctx.lineTo(sx + sw * 0.42, h.y + 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath(); ctx.moveTo(sx, tipY); ctx.lineTo(sx + sw * 0.15, h.y + 2); ctx.lineTo(sx, h.y + 2); ctx.closePath(); ctx.fill();
      }
    } else if (h.type === "pendulum") {
      ctx.strokeStyle = "rgba(30,40,58,0.85)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(h.x - 26, h.anchorY - 9); ctx.lineTo(h.x - 26, h.anchorY - 130); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(h.x + 26, h.anchorY - 9); ctx.lineTo(h.x + 26, h.anchorY - 130); ctx.stroke();
      ctx.fillStyle = "#20283a";
      ctx.fillRect(h.x - 30, h.anchorY - 9, 60, 9);
      ctx.fillStyle = "rgba(230,90,90,0.5)";
      ctx.fillRect(h.x - 30, h.anchorY - 9, 60, 2.5);
      ctx.fillStyle = "#39445a";
      ctx.fillRect(h.x - 5, h.anchorY, 10, 4);
      ctx.strokeStyle = "#55617a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(h.x, h.anchorY); ctx.lineTo(h.bx, h.by); ctx.stroke();
      ctx.fillStyle = "#6d7b93";
      for (let i = 1; i < 6; i++) {
        const t = i / 6;
        ctx.beginPath(); ctx.arc(h.x + Math.sin(h.ang) * h.L * t, h.anchorY + Math.cos(h.ang) * h.L * t, 1.9, 0, TAU); ctx.fill();
      }
      drawGlow("hazard", 255, 90, 60, h.bx, h.by, h.bobR * 3.2, 0.18);
      ctx.save(); ctx.translate(h.bx, h.by); ctx.rotate(h.ang * 2 + h.t);
      ctx.fillStyle = "#6b7a90";
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.17) * h.bobR, Math.sin(a - 0.17) * h.bobR);
        ctx.lineTo(Math.cos(a) * h.bobR * 1.5, Math.sin(a) * h.bobR * 1.5);
        ctx.lineTo(Math.cos(a + 0.17) * h.bobR, Math.sin(a + 0.17) * h.bobR);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#3a4557";
      ctx.beginPath(); ctx.arc(0, 0, h.bobR, 0, TAU); ctx.fill();
      ctx.fillStyle = "#54617a";
      ctx.beginPath(); ctx.arc(-h.bobR * 0.26, -h.bobR * 0.3, h.bobR * 0.44, 0, TAU); ctx.fill();
      ctx.restore();

    } else if (h.type === "flame") {
      const cx = h.x + h.w / 2, top = h.y + h.h;
      ctx.fillStyle = "#2a3442";
      ctx.fillRect(h.x - 5, top - 3, h.w + 10, 12);
      ctx.fillStyle = "#111821";
      ctx.fillRect(h.x, top - 1, h.w, 7);
      ctx.fillStyle = "rgba(255,150,60,0.5)";
      ctx.fillRect(h.x + 2, top - 1, h.w - 4, 1.6);
      if (h.ph === "warn") {
        drawGlow("flame", 255, 150, 60, cx, top - 6, 34 + 46 * h.charge, 0.30 + 0.45 * h.charge * (0.6 + 0.4 * Math.sin(now * 24)));
      } else if (h.ph === "burn") {
        drawGlow("flame", 255, 150, 60, cx, top - h.col * 0.5, h.col * 1.55, 0.62);
        const cols = ["rgba(255,110,40,0.78)", "rgba(255,170,60,0.82)", "rgba(255,238,175,0.92)"];
        for (let layer = 0; layer < 3; layer++) {
          const wB = h.w * (0.62 - layer * 0.16);
          const lh = h.col * (1 - layer * 0.15);
          const wob = Math.sin(now * (14 + layer * 5) + h.phase * 9 + layer) * 2.6;
          ctx.fillStyle = cols[layer];
          ctx.beginPath();
          ctx.moveTo(cx - wB, top);
          ctx.quadraticCurveTo(cx - wB * 0.5, top - lh * 0.6, cx + wob * 0.4, top - lh);
          ctx.quadraticCurveTo(cx + wB * 0.5, top - lh * 0.6, cx + wB, top);
          ctx.closePath(); ctx.fill();
        }
      }

    } else if (h.type === "icicle") {
      const cx = h.x + h.w / 2;
      if (h.state === "hang" || h.state === "wobble") {
        ctx.fillStyle = "#26374a";
        ctx.beginPath(); ctx.ellipse(cx, h.anchorY - 9, 11, 4.4, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#33465c";
        ctx.fillRect(cx - 9, h.anchorY - 9, 18, 9);
      }
      ctx.save(); ctx.translate(cx, h.y); ctx.rotate(h.rot * 0.3);
      const grad = ctx.createLinearGradient(0, 0, 0, h.len + 6);
      grad.addColorStop(0, "#aecfe8"); grad.addColorStop(0.5, "#cfe9ff"); grad.addColorStop(1, "#f2fbff");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-h.w * 0.5, 0);
      ctx.lineTo(h.w * 0.5, 0);
      ctx.lineTo(h.w * 0.16, h.len * 0.6);
      ctx.lineTo(0, h.len);
      ctx.lineTo(-h.w * 0.16, h.len * 0.6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.moveTo(-h.w * 0.22, 0); ctx.lineTo(0, 0); ctx.lineTo(-h.w * 0.04, h.len * 0.7); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(h.w * 0.2, 2); ctx.lineTo(h.w * 0.06, h.len * 0.55); ctx.stroke();
      ctx.restore();
      drawGlow("hazard", 150, 210, 255, cx, h.y + h.len * 0.4, 34, 0.16);

    } else if (h.type === "crusher") {
      const cx = h.x + h.w / 2;
      ctx.strokeStyle = "rgba(120,132,152,0.55)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx - h.w * 0.28, h.y); ctx.lineTo(cx - h.w * 0.28, cam.y - 40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + h.w * 0.28, h.y); ctx.lineTo(cx + h.w * 0.28, cam.y - 40); ctx.stroke();
      const warn = h.state === "wind" ? clamp(h.t / CFG.crusherWindup, 0, 1) : (h.state === "slam" ? 1 : 0);
      if (warn > 0) {
        ctx.globalAlpha = 0.22 + 0.42 * warn * (0.6 + 0.4 * Math.sin(now * 24));
        const g2 = ctx.createLinearGradient(cx, h.y + h.h, cx, h.restY + h.h);
        g2.addColorStop(0, "rgba(255,120,60,0.55)"); g2.addColorStop(1, "rgba(255,120,60,0)");
        ctx.fillStyle = g2; ctx.fillRect(h.x, h.y + h.h, h.w, Math.max(1, h.restY - h.y + h.h));
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "#3c4450";
      ctx.fillRect(h.x - 3, h.y, h.w + 6, h.h);
      ctx.fillStyle = "#586170";
      ctx.fillRect(h.x, h.y + 2, h.w, h.h - 6);
      ctx.fillStyle = "#7c8797";
      ctx.fillRect(h.x, h.y + 2, h.w, 3);
      ctx.fillStyle = "#2a313b";
      ctx.fillRect(h.x - 1, h.y + h.h - 8, h.w + 2, 6);
      ctx.fillStyle = "#9aa6b6";
      for (let i = 0; i < 4; i++) {
        const sx = h.x + 5 + i * (h.w - 10) / 3;
        ctx.beginPath(); ctx.moveTo(sx - 4, h.y + h.h - 3); ctx.lineTo(sx, h.y + h.h + 7); ctx.lineTo(sx + 4, h.y + h.h - 3); ctx.closePath(); ctx.fill();
      }
      drawGlow("hazard", 255, 120, 60, cx, h.y + h.h * 0.6, 46, warn > 0 ? 0.3 : 0.14);

    } else if (h.type === "boulder") {
      const gy = groundTopAt(h.x);
      if (gy !== null) {
        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.beginPath(); ctx.ellipse(h.x, gy, h.r * 1.05, 4.5, 0, 0, TAU); ctx.fill();
      }
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
      ctx.fillStyle = "#5b4f3f";
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * TAU, rr = h.r * (0.86 + hash(i * 3.7 + h.phase * 20) * 0.26);
        if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#4a3f31";
      ctx.beginPath(); ctx.arc(h.r * 0.3, h.r * 0.26, h.r * 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(180,200,220,0.10)";
      ctx.beginPath(); ctx.arc(-h.r * 0.3, -h.r * 0.32, h.r * 0.42, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(20,16,12,0.55)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-h.r * 0.2, -h.r * 0.5); ctx.lineTo(h.r * 0.1, 0); ctx.lineTo(-h.r * 0.15, h.r * 0.4); ctx.stroke();
      ctx.restore();

    } else if (h.type === "piranha") {
      const cx = h.x + h.w / 2;
      if (h.state === "lurk") {
        /* barely there — a dark shape and a ripple, nothing you can name yet */
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#08181c";
        ctx.beginPath(); ctx.ellipse(cx, h.y + h.h * 0.5, h.w * 0.5, h.h * 0.45, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        drawGlow("hazard", 150, 220, 235, cx, h.y + h.h * 0.4, 24, 0.05);
      } else {
        ctx.save(); ctx.translate(cx, h.y + h.h / 2); ctx.scale(h.facing || 1, 1);
        ctx.globalAlpha = h.state === "wind" ? 0.45 : 1;
        ctx.fillStyle = "#16303a";
        ctx.beginPath();
        ctx.moveTo(-h.w * 0.5, 0);
        ctx.quadraticCurveTo(0, -h.h * 0.8, h.w * 0.52, -h.h * 0.12);
        ctx.quadraticCurveTo(h.w * 0.22, h.h * 0.16, h.w * 0.12, h.h * 0.46);
        ctx.lineTo(-h.w * 0.1, h.h * 0.2);
        ctx.quadraticCurveTo(-h.w * 0.3, h.h * 0.5, -h.w * 0.5, 0);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-h.w * 0.46, 0); ctx.lineTo(-h.w * 0.74, -h.h * 0.44); ctx.lineTo(-h.w * 0.62, 0); ctx.lineTo(-h.w * 0.76, h.h * 0.42); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#e8dfd0";
        for (let i = 0; i < 4; i++) { const tx = h.w * 0.14 + i * 4.4; ctx.beginPath(); ctx.moveTo(tx, -h.h * 0.16); ctx.lineTo(tx + 2.1, h.h * 0.16); ctx.lineTo(tx + 4.2, -h.h * 0.16); ctx.closePath(); ctx.fill(); }
        ctx.fillStyle = "#b7322e";
        ctx.beginPath(); ctx.arc(h.w * 0.17, -h.h * 0.14, 2.1, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.restore();
        drawGlow("hazard", 150, 220, 235, cx, h.y + h.h * 0.4, 28, 0.18);
      }

    } else if (h.type === "fall") {
      ctx.save(); ctx.translate(h.x + h.w / 2, h.y + h.h / 2); ctx.rotate(h.rot);
      if (h.ice) {
        ctx.fillStyle = "rgba(186,220,244,0.9)";
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, h.h);
        ctx.fillStyle = "rgba(244,252,255,0.95)";
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, 3);
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-h.w * 0.3, -h.h / 2); ctx.lineTo(0, h.h / 2); ctx.lineTo(h.w * 0.34, -h.h / 2); ctx.stroke();
      } else {
        ctx.fillStyle = "#3a2c1e";
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, h.h);
        ctx.fillStyle = "#5a4429";
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, 3.5);
        ctx.fillStyle = "rgba(16,11,6,0.5)";
        for (let i = 1; i < 5; i++) ctx.fillRect(-h.w / 2 + (i / 5) * h.w - 0.7, -h.h / 2 + 1, 1.4, h.h - 1);
      }
      ctx.restore();
    }
  }
}

/* --------------------------------------------------- companion: kitsune -- */
const C_FUR = "#f7eedb", C_FUR2 = "#ddc79f", C_FUR3 = "#b08b52", C_FOXRED = "#d8464d";
function makePet() {
  return {
    x: 0, y: 0, vx: 0, vy: 0, w: 20, h: 18,
    facing: 1, anim: Math.random() * 9, mode: "follow", t: 0,
    flash: 0, guardCd: 0, atkCd: 0, target: null, saves: 0, yips: 0, active: false,
    hp: 60, maxHp: 60, healT: 0, guardFire: false, sacrificed: false, burnT: 0,
  };
}
let PET = makePet();
function petCenter() { return { x: PET.x + PET.w / 2, y: PET.y + PET.h / 2 }; }
/* the fire that lingers around the kitsune's tail — the only light in the dark */
function petFlame() {
  const c = petCenter();
  return { x: c.x + (PET.facing || 1) * -17.5, y: c.y - 15 };
}

/* scan for the thing most worth reacting to: a projectile that will hit the
   player, or an enemy close enough to be a problem (attacks about to land rank
   above distance). */
function petScan() {
  const p = P, pcx = p.x + p.w / 2, pcy = p.y + p.h * 0.5;
  let proj = null, projT = 1e9;
  for (const pr of projs) {
    if (pr.friendly || pr.noGuard) continue;
    const rx = pcx - (pr.x + pr.w / 2), ry = (pcy - 4) - (pr.y + pr.h / 2);
    const vv = pr.vx * pr.vx + pr.vy * pr.vy;
    if (vv < 400) continue;
    const t = (rx * pr.vx + ry * pr.vy) / vv;
    if (t < 0.02 || t > 0.85) continue;
    const fx = pr.x + pr.w / 2 + pr.vx * t;
    const fy = pr.y + pr.h / 2 + pr.vy * t + 0.5 * (pr.grav || 0) * t * t;
    const miss = Math.hypot(pcx - fx, (pcy - 4) - fy);
    if (miss < 40 && t < projT) { proj = pr; projT = t; }
  }
  let foe = null, foeUrg = 1e9;
  for (const e of enemies) {
    if (e.dead) continue;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    if (Math.hypot(pcx - ecx, pcy - ecy) > CFG.petRange) continue;
    let urg = 1.0;
    if (e.state === "wind") urg = (e.type === "brute" ? 0.62 : 0.4) - e.t;
    else if (e.state === "strike") urg = 0.02;
    else if (e.state === "dive") urg = Math.max(0, 0.72 - e.t);
    if (urg < foeUrg) { foeUrg = urg; foe = e; }
  }
  return { proj, projT, foe, foeUrg };
}

function petBlock(pr) {
  const k = PET;
  const bx = pr.x + pr.w / 2, by = pr.y + pr.h / 2;
  const i = projs.indexOf(pr);
  if (i >= 0) projs.splice(i, 1);
  spark(bx, by, 18, "#ffe9a0", 300, 0.5);
  ring(bx, by, 4, 42, "#ffe07a", 0.3);
  petals(bx, by, 8, "#fff3c4");
  hitStop = Math.max(hitStop, 0.045); addShake(6);
  k.guardCd = CFG.petGuardCd; k.flash = 0.28; k.saves++;
  k.vx -= Math.sign(pr.vx || k.facing) * 120; k.vy -= 60;
  A.block();
  game.popTexts.push({ x: bx, y: by - 14, t: 0, life: 0.7, s: "GUARD" });
  k.mode = "follow"; k.target = null;
}

function petStrike(e) {
  const k = PET, pcx = P.x + P.w / 2;
  const dir = Math.sign(e.x + e.w / 2 - pcx) || k.facing;
  const interrupt = (e.state === "wind" || e.state === "strike");
  hurtEnemy(e, CFG.petDmg, dir);
  if (interrupt && !e.dead) {
    e.state = "rec"; e.t = 0; e.struck = false; e.cd = Math.max(e.cd, 0.9);
    hitStop = Math.max(hitStop, 0.06);
    game.popTexts.push({ x: e.x + e.w / 2, y: e.y - 14, t: 0, life: 0.8, s: "SAVED!" });
    ring(e.x + e.w / 2, e.y + e.h * 0.45, 6, 46, "#ffe07a", 0.32);
  }
  k.atkCd = interrupt ? 0.5 : CFG.petAtkCd; k.flash = 0.3; k.yips++;
  k.vx = -dir * 170; k.vy = -90;
  A.yip();
  k.mode = "follow"; k.target = null;
}

function updatePet(dt) {
  const k = PET;
  if (!k.active) return;
  const p = P;
  k.anim += dt;
  if (k.flash > 0) k.flash -= dt;
  if (k.guardCd > 0) k.guardCd -= dt;
  if (k.atkCd > 0) k.atkCd -= dt;

  const live = state === "play" && !p.dead;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h * 0.5;

  /* pick a mode — while the twin horrors stand the fox only carries
     its tail-fire: no guard, no bites, the ninja fights alone */
  if (k.mode === "guardian") {
    k.t += dt;
    k.target = null;
  } else if (k.mode === "follow" && live && !twinActive()) {
    const sc = petScan();
    const canGuard = sc.proj && k.guardCd <= 0;
    const canFoe = sc.foe && k.atkCd <= 0;
    if (canGuard && (!canFoe || sc.projT <= sc.foeUrg)) { k.mode = "guard"; k.target = sc.proj; k.t = 0; }
    else if (canFoe) { k.mode = "attack"; k.target = sc.foe; k.t = 0; }
    else if (canGuard) { k.mode = "guard"; k.target = sc.proj; k.t = 0; }
  }

  let tx, ty, stiff = 34, damp = 0.008, maxS = CFG.petSpeed;
  if (k.mode === "guardian") {
    const kc = petCenter();
    let hx = null, hy = null, best = 1e9;
    for (const e of enemies) {
      if (e.dead) continue;
      const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
      const d = Math.hypot(ex - kc.x, ey - kc.y);
      if (d < best && d < 760) { best = d; hx = ex; hy = ey; k.target = e; }
    }
    if (boss && !boss.dead) {
      const ex = boss.x + boss.w / 2, ey = boss.y + boss.h / 2;
      const d = Math.hypot(ex - kc.x, ey - kc.y);
      if (d < best && d < 900) { best = d; hx = ex; hy = ey; k.target = boss; }
    }
    if (boss2 && !boss2.dead) {
      const ex = boss2.x + boss2.w / 2, ey = boss2.y + boss2.h / 2;
      const d = Math.hypot(ex - kc.x, ey - kc.y);
      if (d < best && d < 900) { best = d; hx = ex; hy = ey; k.target = boss2; }
    }
    if (hx === null) {
      k.target = null;
      hx = (p.x + p.w / 2) + p.facing * 170;
      hy = (p.y + p.h * 0.5) - 40;
    }
    tx = hx; ty = hy;
    stiff = 130; damp = 0.30; maxS = CFG.petDashSpeed;
  } else if (k.mode === "guard") {
    const pr = k.target;
    if (!live || !pr || pr.friendly || projs.indexOf(pr) < 0) { k.mode = "follow"; k.target = null; }
    else {
      k.t += dt;
      tx = pr.x + pr.w / 2 + pr.vx * 0.055;
      ty = pr.y + pr.h / 2 + pr.vy * 0.055;
      stiff = 130; damp = 0.30; maxS = CFG.petDashSpeed;
      const c = petCenter();
      if (Math.hypot(tx - c.x, ty - c.y) < 24) petBlock(pr);
      else if (k.t > 1.3) { k.mode = "follow"; k.target = null; }
    }
  } else if (k.mode === "attack") {
    const e = k.target;
    if (!live || !e || e.dead) { k.mode = "follow"; k.target = null; }
    else {
      k.t += dt;
      tx = e.x + e.w / 2; ty = e.y + e.h * 0.45;
      stiff = 130; damp = 0.30; maxS = CFG.petDashSpeed;
      if (aabb({ x: k.x - 4, y: k.y - 4, w: k.w + 8, h: k.h + 8 }, e)) petStrike(e);
      else if (k.t > 0.95) { k.mode = "follow"; k.target = null; }
    }
  }

  if (k.mode === "follow") {
    tx = pcx - p.facing * CFG.petFollow;
    ty = pcy - 30 + Math.sin(k.anim * 2.1) * 3.5;
    const gt = groundTopAt(tx);
    if (gt !== null && ty > gt - 18) ty = gt - 18;
  }

  /* steer */
  const c = petCenter();
  const dx = tx - c.x, dy = ty - c.y;
  k.vx += dx * stiff * dt;
  k.vy += dy * stiff * dt;
  const f = Math.pow(damp, dt);
  k.vx *= f; k.vy *= f;
  const sp = Math.hypot(k.vx, k.vy);
  if (sp > maxS) { k.vx *= maxS / sp; k.vy *= maxS / sp; }
  k.x += k.vx * dt; k.y += k.vy * dt;

  /* keep it out of the terrain and the sky */
  const gt2 = groundTopAt(k.x + k.w / 2);
  if (gt2 !== null && k.y + k.h > gt2 - 5) { k.y = gt2 - 5 - k.h; if (k.vy > 0) k.vy = 0; }
  if (k.y < -330) { k.y = -330; if (k.vy < 0) k.vy = 0; }

  /* snap back if it's left far behind (respawn, pit fall, etc.) */
  if (live && Math.hypot(tx - c.x, ty - c.y) > 540) {
    k.x = tx - k.w / 2; k.y = ty - k.h / 2; k.vx = 0; k.vy = 0;
    if (k.mode !== "guardian") { k.mode = "follow"; k.target = null; }
    ring(k.x + k.w / 2, k.y + k.h / 2, 3, 34, "#ffe07a", 0.35);
  }

  if (k.mode !== "follow" || Math.abs(k.vx) > 40) k.facing = k.vx >= 0 ? 1 : -1;
  else k.facing = p.facing;

  /* spirit sparks */
  const spd = Math.hypot(k.vx, k.vy);
  if (spd > 150 && Math.random() < 0.7) {
    part({ x: c.x, y: c.y, vx: rnd(-14, 14) - k.vx * 0.05, vy: rnd(-14, 14) - k.vy * 0.05, g: -14, life: 0.45, max: 0.45, r: rnd(1.6, 3.4), color: Math.random() < 0.5 ? "#ffd98a" : "#fff2c8", t: "dot", fade: 1 });
  }
}

/* ----------------------------------------------------------------- fixed -- */
/* player update */
function updatePlayer(dt) {
  const p = P;
  p.anim += dt;
  if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }
  if (p.slashCd > 0) p.slashCd -= dt;
  if (p.shuCd > 0) p.shuCd -= dt;
  if (p.dashCd > 0) p.dashCd -= dt;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtLock > 0) p.hurtLock -= dt;
  if (p.landT > 0) p.landT -= dt;
  if (p.tapT > 0) p.tapT -= dt;
  if (p.dashLunge > 0) p.dashLunge -= dt;
  if (p.focusFlash > 0) p.focusFlash -= dt;
  if (p.rageCd > 0) p.rageCd -= dt;
  if (p.attackT >= 0) { p.attackT += dt; if (p.attackT > atkCfg(p.atkKind).end) p.attackT = -1; }
  if (p.shu < CFG.shurikenMax) { p.shuRegen += dt; if (p.shuRegen >= CFG.shurikenRegen) { p.shuRegen = 0; p.shu++; } }

  if (p.dead) {
    p.deadT += dt;
    p.vy += CFG.gravity * 0.6 * dt; p.y += p.vy * dt; p.x += p.vx * dt; p.vx *= 0.9;
    if (p.y + p.h > (groundTopAt(p.x + p.w / 2) ?? 1e9)) { p.y = groundTopAt(p.x + p.w / 2) - p.h; p.vy = 0; p.vx *= 0.7; }
    return;
  }

  const wantCrouch = IN.down && p.onGround;
  p.crouch = wantCrouch;
  const targetH = p.crouch ? 30 : 46;
  if (p.h !== targetH) { const d = targetH - p.h; p.h = targetH; p.y -= d; }

  const dir = Math.sign(IN.ix);
  if (dir !== 0 && p.dashT < 0) p.facing = dir;

  /* wading — a flooded paddy drags at every step (the dash still cuts through) */
  const wcx = p.x + p.w / 2;
  const wr = waterAt(wcx);
  const wading = !!(wr && (p.y + p.h) > waterTopAt(wcx) + 3);
  if (wading && !p.wasWading) {
    A.land(); spark(wcx, p.y + p.h, 9, "#bfeef0", 180, 0.4);
    ring(wcx, p.y + p.h, 4, 24, "#bfeef0", 0.32);
  }
  p.wasWading = wading;

  /* dash */
  if (IN.dashP && p.dashCd <= 0 && p.dashT < 0) {
    p.dashT = 0; p.dashCd = CFG.dashCooldown;
    p.facing = dir !== 0 ? dir : p.facing;
    p.dashDir = p.facing;
    A.jump(); dust(p.x + p.w / 2, p.y + p.h, 8, "#8fd8ff");
  }
  if (p.dashT >= 0) {
    p.dashT += dt;
    p.vx = p.dashDir * CFG.dashSpeed;
    p.vy = 0;
    if (p.dashT > CFG.dashTime) { p.dashT = -1; p.dashLunge = 0.14; }
    if (Math.random() < 0.9) p.trail.push({ x: p.x, y: p.y, w: p.w, h: p.h, life: 0.22, max: 0.22, facing: p.facing });
  } else {
    const hpf = clamp(p.hp / Math.max(1, p.maxHp), 0, 1);
    const wound = 0.55 + 0.45 * hpf;
    const acc = (p.onGround ? CFG.accel : CFG.airAccel) * (wading ? 0.55 : 1);
    if (IN.ix !== 0) {
      p.vx += IN.ix * acc * dt;
      const cap = CFG.runSpeed * wound * (p.crouch ? 0.6 : 1) * (wading ? CFG.paddyDrag : 1);
      p.vx = clamp(p.vx, -cap - 40, cap + 40);
    } else {
      const f = (p.onGround ? CFG.friction : CFG.friction * 0.35) * (wading ? 2.2 : 1) * dt;
      p.vx = p.vx > 0 ? Math.max(0, p.vx - f) : Math.min(0, p.vx + f);
    }
  }

  /* jump */
  if (IN.jumpP) p.jumpBuf = CFG.jumpBuffer;
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  if (p.onGround) { p.coyote = CFG.coyoteTime; p.jumpsLeft = 2; }
  else if (p.coyote > 0) p.coyote -= dt;

  if (p.jumpBuf > 0) {
    const hpf2 = clamp(p.hp / Math.max(1, p.maxHp), 0, 1);
    const jMul = 0.72 + 0.28 * hpf2;
    if (p.coyote > 0) {
      p.vy = -CFG.jumpVel * jMul; p.jumpBuf = 0; p.coyote = 0; p.jumpsLeft = 1; p.onGround = false;
      A.jump(); dust(p.x + p.w / 2, p.y + p.h, 6);
    } else if (p.wallSlide) {
      p.vy = -CFG.jumpVel * 0.95; p.vx = -p.wall * CFG.wallJumpX; p.facing = -p.wall;
      p.jumpBuf = 0; p.jumpsLeft = 1; p.wallLock = 0.14;
      A.jump(); spark(p.x + p.w / 2 - p.wall * 10, p.y + p.h * 0.5, 8, "#bfe8ff", 190, 0.35, -p.wall > 0 ? 0 : Math.PI);
    } else if (p.jumpsLeft > 0) {
      p.vy = -CFG.doubleJumpVel * jMul; p.jumpsLeft--; p.jumpBuf = 0;
      A.jump(); ring(p.x + p.w / 2, p.y + p.h, 4, 26, "#9fe4ff", 0.3);
    }
  }
  if (p.wallLock > 0) { p.wallLock -= dt; if (IN.ix === 0) p.vx *= 0.9; }

  if (!IN.jump && p.vy < -180) p.vy += CFG.gravity * 1.6 * dt;

  /* gravity */
  p.vy += CFG.gravity * dt;
  const sliding = p.wallSlide && p.vy > 0;
  if (sliding) p.vy = Math.min(p.vy, CFG.wallSlideSpeed);
  p.vy = Math.min(p.vy, CFG.maxFall);
  if (wading) {
    const deep = clamp(((p.y + p.h) - waterTopAt(wcx)) / Math.max(8, CFG.paddyDepth), 0, 1);
    p.vy = Math.min(p.vy, CFG.maxFall * (0.78 - 0.34 * deep));
    if (Math.abs(p.vx) > 90 && SAVE.set.parts && Math.random() < 0.35) {
      const wx = wcx + (Math.random() - 0.5) * 26;
      part({ x: wx, y: waterTopAt(wx) + 2, vx: -Math.sign(p.vx) * rnd(10, 44), vy: rnd(-42, -10), g: 130, life: 0.4, max: 0.4, r: rnd(1, 2.2), color: "#cdeef0", t: "dot", fade: 1 });
    }
  }

  /* attack — context-sensitive swordplay:
     ground/air = slash · ↓ in the air = plunge (bounces off what it hits)
     slash during/just after a dash = lunge · full focus = KAGE-GIRI (guard-breaking wave)
     A scavenged weapon replaces the swordplay outright: every one of those
     inputs becomes that weapon's own move — no blade ever leaves your hand. */
  if ((IN.punchP || IN.kickP) && p.slashCd <= 0 && p.attackT < 0) {
    p.attackHits.length = 0; p.attackT = 0; p.plungeHit = false; p.wpFired = false; p.slamImpact = false;
    const wantKick = IN.kickP && !IN.punchP;
    if (wantKick && (!p.onGround || Math.abs(IN.ix) > 0.2 || Math.abs(p.vx) > 60)) { p.atkKind = "round"; p.slashCd = CFG.slashCooldown * 1.25; }
    else if (wantKick) { p.atkKind = "kick"; p.slashCd = CFG.slashCooldown * 1.1; }
    else { p.atkKind = "punch"; p.slashCd = CFG.slashCooldown * 0.7; }
    if (p.atkKind === "round" && Math.abs(IN.ix) > 0.2) p.facing = Math.sign(IN.ix);
    if (p.atkKind === "kick") { p.vx += p.facing * 120; }
    A.slash();
    IN.punchP = false; IN.kickP = false;
  }
  if (IN.slashP && p.slashCd <= 0) {
    p.attackHits.length = 0; p.attackT = 0; p.plungeHit = false; p.wpFired = false;
    /* the katana must be in hand for any of the blade techniques */
    const w = p.weapon && WEAPONS[p.weapon.id];
    if (!w && p.focus >= CFG.focusMax) {
      p.atkKind = "kage"; p.focus = 0;
      p.slashCd = CFG.slashCooldown * 1.4;
      p.invuln = Math.max(p.invuln, CFG.kageInvuln);
      launchKage(p);
    } else if (!w && !p.onGround && IN.down) {
      p.atkKind = "plunge"; p.slashCd = CFG.slashCooldown;
      p.vy = CFG.plungeSpeed;
      A.slash(); spark(p.x + p.w / 2, p.y + p.h - 6, 8, "#cfe9ff", 180, 0.3);
    } else if (!w && (p.dashT >= 0 || p.dashLunge > 0)) {
      p.atkKind = "lunge"; p.slashCd = CFG.slashCooldown * 1.15;
      p.dashT = -1; p.dashLunge = 0;
      p.invuln = Math.max(p.invuln, 0.14);
      p.facing = p.dashDir || p.facing;
      A.slash();
    } else {
      /* a scavenged weapon swings the way its owner did */
      p.atkKind = (w && WEAPON_ATK[w.id]) || (p.onGround ? "ground" : "air");
      p.slamImpact = false;
      if (w) {
        p.slashCd = CFG.slashCooldown * w.swing;
        p.weapon.uses--;
        p.wpFlash = 0.3;
        if (w.id === "spear") A.throwS();                      /* a shaft through the air */
        else if (w.kind === "heavy") A.boulder();
        else if (w.kind === "ranged" || w.kind === "bomb") A.throwS();
        else if (w.kind === "bash") A.guard();
        else A.slash();
        p.weapon.broken = p.weapon.uses <= 0;
      } else {
        p.slashCd = CFG.slashCooldown;
        A.slash();
      }
    }
  }
  /* a spent weapon falls apart the moment the swing finishes */
  if (p.weapon && p.weapon.broken && p.attackT < 0) {
    const bx = p.x + p.w / 2, by = p.y + p.h * 0.5;
    A.guard(); spark(bx, by, 14, "#c8d6e8", 240, 0.4);
    ring(bx, by, 4, 30, "#9fb4cc", 0.25);
    game.popTexts.push({ x: bx, y: p.y - 4, t: 0, life: 0.9, s: "WEAPON BROKEN" });
    const idx = ARSENAL.indexOf(p.weapon);
    if (idx >= 0) ARSENAL.splice(idx, 1);
    /* fall back to whatever slid into its slot, else the katana */
    selectWeaponAt(Math.min(WSEL, ARSENAL.length));
  }
  p.wpFlash = Math.max(0, p.wpFlash - dt);

  /* the lunge drives you forward for its active window */
  if (p.atkKind === "lunge" && p.attackT >= 0 && p.attackT < atkCfg("lunge").a1) {
    p.vx = p.facing * CFG.lungeSpeed;
    if (Math.random() < 0.8) p.trail.push({ x: p.x, y: p.y, w: p.w, h: p.h, life: 0.2, max: 0.2, facing: p.facing });
  }
  /* the scavenged weapons carry you the way their owners moved — and, like
     those owners, the step lands WITH the blow, not during the wind-up: the
     yari thrusts you down its own length, the shield shoves you in, and the
     kanabō plants a heavy step through the slam */
  if (p.attackT >= 0) {
    const A_ = atkCfg(p.atkKind);
    const inWin = p.attackT >= A_.a0 && p.attackT < A_.a1;
    if (inWin && p.atkKind === "thrust") {
      p.vx = p.facing * CFG.spearDrive;
      if (Math.random() < 0.5) p.trail.push({ x: p.x, y: p.y, w: p.w, h: p.h, life: 0.13, max: 0.13, facing: p.facing });
    } else if (inWin && p.atkKind === "bash") {
      p.vx = p.facing * CFG.bashDrive;
    } else if (inWin && p.atkKind === "slam") {
      p.vx = p.facing * 60;
    }
  }
  /* the plunge commits you to a fast drop until it connects */
  if (p.atkKind === "plunge" && p.attackT >= 0 && !p.plungeHit) p.vy = Math.max(p.vy, CFG.plungeSpeed);
  if (IN.throwP && p.shuCd <= 0 && p.shu > 0 && progress.hasChakra) {
    p.shu--; p.shuCd = CFG.shurikenCooldown;
    projs.push({ type: "shuriken", x: p.x + p.w / 2 + p.facing * 10, y: p.y + p.h * 0.4, w: 12, h: 12, vx: p.facing * CFG.shurikenSpeed, vy: -30, rot: 0, spin: 26, life: 2.2, friendly: true, dmg: 1 });
    A.throwS();
  }

  if (IN.rageP) doRage();
  /* move + collide */
  p.wall = 0;
  const wasGround = p.onGround;
  moveCollide(p, dt);
  if (p.wall !== 0 && !p.onGround && Math.sign(IN.ix) === p.wall && p.vy > 0) p.wallSlide = true; else p.wallSlide = false;

  if (p.onGround && !wasGround && p.vy >= 0) {
    if (Math.abs(p.vy) > 300) { A.land(); dust(p.x + p.w / 2, p.y + p.h, 8); }
    else dust(p.x + p.w / 2, p.y + p.h, 4);
  }
  if (p.onGround && Math.abs(p.vx) > 60 && Math.random() < 0.25) {
    part({ x: p.x + p.w / 2 - Math.sign(p.vx) * 8, y: p.y + p.h, vx: -p.vx * 0.12, vy: rnd(-30, -6), g: 40, life: 0.35, max: 0.35, r: rnd(1.5, 3), color: "#5f7896", t: "dot", fade: 1 });
  }

  if (p.y > KILL_Y) {
    const spot = nearestGround(p.x + p.w / 2);
    if (spot) {
      p.x = spot.x - p.w / 2;
      p.y = spot.y - p.h - 4;
      p.vx = 0; p.vy = 0; p.dashT = -1;
      cam.y = clamp(p.y + p.h * 0.5 - VH * 0.66, -400, 400);
      dust(p.x + p.w / 2, p.y + p.h, 12, "#7fb0e0");
    }
    damagePlayer(1, p.x - 60, true);
  }

  for (const s of solids) {
    if (!s.spikes || p.dead) continue;
    if (p.x + p.w > s.x + 2 && p.x < s.x + s.w - 2) {
      const feet = p.y + p.h;
      if (feet > s.y + 3 && feet < s.y + s.h + 10) damagePlayer(1, s.x + s.w / 2);
    }
  }

  /* run cycle + state */
  const sp = Math.abs(p.vx);
  if (p.crouch && p.onGround && sp > 90) p.state = "slide";
  else if (!p.onGround) p.state = p.wallSlide ? "wall" : (p.vy < 0 ? "jump" : "fall");
  else if (sp > 20) p.state = "run";
  else p.state = "idle";
  p.runPhase += (p.onGround ? sp * 0.055 : 6) * dt;

  /* trail decay */
  for (let i = p.trail.length - 1; i >= 0; i--) { p.trail[i].life -= dt; if (p.trail[i].life <= 0) p.trail.splice(i, 1); }

  /* scarf */
  updateScarf(dt, p);
}

function moveCollide(e, dt) {
  e.wall = 0;
  const wasGround = e.onGround;
  const wantVx = e.vx;
  e.x += e.vx * dt;
  const wantX = e.x;
  let blocked = false;
  for (const s of solids) {
    if (s.oneWay || s.spikes) continue;
    if (aabb(e, s)) {
      if (e.vx > 0) { e.x = s.x - e.w; e.wall = 1; }
      else if (e.vx < 0) { e.x = s.x + s.w; e.wall = -1; }
      else e.wall = (e.x + e.w / 2 < s.x + s.w / 2) ? 1 : -1;
      e.vx = 0; blocked = true;
    }
  }
  /* auto step-up (≤16px): probe from the *attempted* x so the ledge is actually
     in the way — at the clamped x nothing ever overlaps, so it could only ever
     lift 1px and the runner would jam on every rising ground step */
  if (blocked && wasGround && e.wall !== 0) {
    for (let i = 1; i <= 16; i++) {
      const probe = { x: wantX, y: e.y - i, w: e.w, h: e.h };
      let free = true;
      for (const s of solids) {
        if (s.oneWay || s.spikes) continue;
        if (aabb(probe, s)) { free = false; break; }
      }
      if (free) { e.x = wantX; e.y -= i; e.vx = wantVx; e.wall = 0; e.onGround = true; break; }
    }
  }
  const prevBot = e.y + e.h;
  e.y += e.vy * dt;
  e.onGround = false;
  for (const s of solids) {
    if (s.spikes || !aabb(e, s)) continue;
    if (s.oneWay) { if (!(e.vy > 0 && prevBot <= s.y + 6)) continue; }
    if (e.vy > 0) { e.y = s.y - e.h; e.vy = 0; e.onGround = true; }
    else if (e.vy < 0) { e.y = s.y + s.h; e.vy = 0; }
  }
}

/* scarf ribbon (verlet) */
function updateScarf(dt, p) {
  const N = 11, link = 4.2;
  if (p.scarf.length === 0) {
    for (let i = 0; i < N; i++) {
      const sx = p.x + p.w / 2 - p.facing * i * link, sy = p.y + 10 + i * 2;
      p.scarf.push({ x: sx, y: sy, px: sx, py: sy });
    }
  }
  const rx = p.x + p.w / 2 - p.facing * 3, ry = p.y + 9;
  for (let i = 0; i < N; i++) {
    const q = p.scarf[i];
    const vx = (q.x - q.px) * 0.90, vy = (q.y - q.py) * 0.90;
    q.px = q.x; q.py = q.y;
    q.x += vx + Math.sin(p.anim * 7 + i * 0.8) * 0.3;
    q.y += vy + 0.34;
  }
  p.scarf[0].x = rx; p.scarf[0].y = ry;
  for (let k = 0; k < 5; k++) {
    for (let i = 1; i < N; i++) {
      const a = p.scarf[i - 1], b = p.scarf[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dl = Math.hypot(dx, dy) || 0.001;
      const diff = (dl - link) / dl;
      const w0 = i === 1 ? 0 : 0.5, w1 = i === 1 ? 1 : 0.5;
      if (w0) { a.x += dx * diff * w0; a.y += dy * diff * w0; }
      b.x -= dx * diff * w1; b.y -= dy * diff * w1;
    }
  }
}

/* ------------------------------------------------------------ collisions -- */
const ATK = {
  ground: { a0: 0.05, a1: 0.19, end: 0.30, dmg: 1 },

  if (CFG.maxHealth >= 20) amount = amount * 8;
  /* a scavenged tower shield blocks the way the ashigaru's does: it eats a
     point off anything that hits it from the side you are facing (flank it and
     it does nothing), and never on a forced hit */
  const held = p.weapon && WEAPONS[p.weapon.id];
  if (held && held.kind === "bash" && amount > 1 && !force
      && Math.sign(srcX - (p.x + p.w / 2)) === p.facing) {
    amount -= (CFG.maxHealth >= 20 ? 8 : 1);
    game.popTexts.push({ x: p.x + p.w / 2, y: p.y - 4, t: 0, life: 0.7, s: "BLOCKED" });
    A.guard();
  }
  p.hp -= amount; p.invuln = CFG.invuln; p.hurtLock = 0.55;
  P.combo = 0;
  const dir = srcX < p.x + p.w / 2 ? 1 : -1;
  p.vx = dir * 220; p.vy = -260;
  A.hurt(); addShake(12); hitStop = 0.07;
  spark(p.x + p.w / 2, p.y + p.h / 2, 14, "#ff6b6b", 280, 0.5);
  if (p.hp <= 0) {
    p.hp = 0; p.dead = true; p.deadT = 0; A.die(); addShake(18);
    SAVE.stats.deaths = (SAVE.stats.deaths || 0) + 1; saveSoon();

}

/* ------------------------------------------------------------- enemies AI -- */
function updateEnemies(dt) {
  const p = P;
  for (const e of enemies) {
    if (e.dead) { e.deathT += dt; continue; }
    e.anim += dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.t += dt; if (e.cd > 0) e.cd -= dt;
    if (e.turnCd > 0) e.turnCd -= dt;
    const pcx = p.x + p.w / 2, ecx = e.x + e.w / 2;
    const dx = pcx - ecx, dy = (p.y + p.h / 2) - (e.y + e.h / 2);
    const dist = Math.hypot(dx, dy);
    const seeP = dist < e.look && !p.dead;

    if (e.type === "grunt" || e.type === "brute") {
      if (e.state === "idle" || e.state === "walk") {
        e.state = "walk";
        const spd = seeP ? e.speed * 1.15 : e.speed * 0.4;
        const dir = seeP ? Math.sign(dx) || e.facing : e.facing;
        if (seeP) e.facing = dir;
        e.vx = dir * spd;
        const ahead = e.x + e.w / 2 + dir * (e.w / 2 + 12);
        const gt = groundTopAt(ahead);
        if (gt === null || Math.abs(gt - (e.y + e.h)) > 30) { if (!seeP) { e.facing *= -1; } else e.vx = 0; }
        if (e.wall !== 0) { if (!seeP) e.facing *= -1; }
        const reach = e.type === "brute" ? 66 : 46;
        if (seeP && Math.abs(dx) < reach && Math.abs(dy) < 46 && e.cd <= 0) {
          e.state = "wind"; e.t = 0; e.cd = e.type === "brute" ? 2.1 : 1.5;
        }
      } else if (e.state === "wind") {
        e.vx *= 0.85;
        const windT = e.type === "brute" ? 0.62 : 0.4;
        if (e.t > windT) { e.state = "strike"; e.t = 0; A.slash(); }
      } else if (e.state === "strike") {
        e.vx = e.facing * 40;
        const stT = e.type === "brute" ? 0.24 : 0.16;
        const hb = { x: e.facing > 0 ? e.x + e.w - 4 : e.x - (e.type === "brute" ? 62 : 44), y: e.y - 6, w: e.type === "brute" ? 62 : 44, h: e.h + 12 };
        if (e.t < stT && !e.struck) {
          if (aabb(hb, p)) { damagePlayer(1, ecx); e.struck = true; }
        }
        if (e.t > stT) { e.state = "rec"; e.t = 0; e.struck = false; }
      } else if (e.state === "rec") {
        e.vx *= 0.8;
        if (e.t > (e.type === "brute" ? 0.9 : 0.55)) { e.state = "walk"; e.t = 0; }
      }
    } else if (e.type === "archer") {
      if (e.state === "idle") {
        e.vx = 0;
        if (seeP && Math.abs(dy) < 110) {
          if (Math.sign(dx) !== e.facing) { e.facing = Math.sign(dx) || e.facing; }
          e.state = "draw"; e.t = 0;
        }
      } else if (e.state === "draw") {
        e.vx = 0;
        if (Math.sign(dx) === e.facing) e.facing = Math.sign(dx);
        if (e.t > 0.62) {
          e.state = "rec"; e.t = 0;
          const sp = 330 + 120 * difficultyAt(e.x);
          const ang = Math.atan2((p.y + p.h * 0.5) - (e.y + 20), dx);
          projs.push({ type: "arrow", x: ecx + e.facing * 12, y: e.y + 20, w: 18, h: 6, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 40, life: 3.2, friendly: false, dmg: 1, rot: ang, grav: 300 });
          A.throwS();
        }
      } else if (e.state === "rec") {
        e.vx = 0;
        if (e.t > 0.8) { e.state = "idle"; e.t = 0; }
      }
    } else if (e.type === "shield") {
      if (e.state === "idle" || e.state === "walk") {
        e.state = "walk";
        /* it turns slowly — that hesitation is your window to get around it */
        if (seeP && e.turnCd <= 0) {
          const want = Math.sign(dx) || e.facing;
          if (want !== e.facing) { e.facing = want; e.turnCd = 0.75; }
        }
        e.vx = e.facing * (seeP ? e.speed : e.speed * 0.35);
        const ahead = e.x + e.w / 2 + e.facing * (e.w / 2 + 12);
        const gt = groundTopAt(ahead);
        if (gt === null || Math.abs(gt - (e.y + e.h)) > 30 || e.wall !== 0) e.vx = 0;
        if (seeP && Math.abs(dx) < 56 && Math.abs(dy) < 48 && e.cd <= 0) { e.state = "wind"; e.t = 0; e.cd = 1.9; }
      } else if (e.state === "wind") {
        e.vx *= 0.8;
        if (e.t > 0.5) { e.state = "strike"; e.t = 0; A.slash(); }
      } else if (e.state === "strike") {
        e.vx = e.facing * 160;
        const hb = { x: e.facing > 0 ? e.x + e.w - 4 : e.x - 50, y: e.y - 6, w: 50, h: e.h + 12 };
        if (e.t < 0.2 && !e.struck && aabb(hb, p)) {
          const shielded = p.invuln > 0 || p.dashT >= 0;
          damagePlayer(1, ecx);
          if (!shielded && !p.dead) { p.vx = e.facing * 520; p.vy = -200; }
          e.struck = true;
        }
        if (e.t > 0.2) { e.state = "rec"; e.t = 0; e.struck = false; }
      } else if (e.state === "rec") {
        e.vx *= 0.8;
        if (e.t > 0.7) { e.state = "walk"; e.t = 0; }
      }
    } else if (e.type === "spearman") {
      const REACH = 104;
      if (e.state === "idle" || e.state === "walk") {
        e.state = "walk";
        const dir = seeP ? (Math.sign(dx) || e.facing) : e.facing;
        if (seeP) e.facing = dir;
        const want = (seeP && Math.abs(dx) > 132) ? e.speed : 0;
        e.vx = seeP ? dir * want : e.facing * e.speed * 0.3;
        const ahead = e.x + e.w / 2 + dir * (e.w / 2 + 12);
        const gt = groundTopAt(ahead);
        if (gt === null || Math.abs(gt - (e.y + e.h)) > 30) { if (!seeP) e.facing *= -1; else e.vx = 0; }
        if (e.wall !== 0) e.vx = 0;
        if (seeP && Math.abs(dx) < 178 && Math.abs(dy) < 64 && e.cd <= 0) { e.state = "wind"; e.t = 0; e.cd = 2.3; A.guard(); }
      } else if (e.state === "wind") {
        e.vx *= 0.86;
        if (e.t > 0.72) { e.state = "thrust"; e.t = 0; e.struck = false; A.slash(); }
      } else if (e.state === "thrust") {
        e.vx = e.facing * 250;
        const hb = e.facing > 0
          ? { x: e.x + e.w - 6, y: e.y + 8, w: REACH, h: 18 }
          : { x: e.x - REACH + 6, y: e.y + 8, w: REACH, h: 18 };
        if (!e.struck && aabb(hb, p)) { damagePlayer(1, ecx); e.struck = true; }
        if (e.t > 0.26) { e.state = "rec"; e.t = 0; }
      } else if (e.state === "rec") {
        e.vx *= 0.82;
        if (e.t > 0.78) { e.state = "walk"; e.t = 0; }
      }
    } else if (e.type === "bomber") {
      if (e.state === "idle" || e.state === "walk") {
        e.state = "walk";
        const dir = seeP ? (Math.sign(dx) || e.facing) : e.facing;
        if (seeP) e.facing = dir;
        const adx = Math.abs(dx);
        if (seeP) {
          if (adx < 132) e.vx = -dir * e.speed;          /* kite: back away when crowded */
          else if (adx > 300) e.vx = dir * e.speed * 0.7;
          else e.vx = 0;
        } else e.vx = e.facing * e.speed * 0.3;
        const ahead = e.x + e.w / 2 + Math.sign(e.vx || e.facing) * (e.w / 2 + 12);
        const gt = groundTopAt(ahead);
        if (gt === null || Math.abs(gt - (e.y + e.h)) > 30 || e.wall !== 0) { e.vx = 0; if (!seeP) e.facing *= -1; }
        if (seeP && adx < 390 && Math.abs(dy) < 160 && e.cd <= 0) { e.state = "lob"; e.t = 0; e.cd = 2.6; }
      } else if (e.state === "lob") {
        e.vx *= 0.8;
        if (e.t > 0.5) {
          e.state = "rec"; e.t = 0;
          const bx = ecx + e.facing * 12, by = e.y + 8;
          const tx = p.x + p.w / 2 + p.vx * 0.35;
          const g = 900;
          const dxr = tx - bx;
          const tf = clamp(Math.abs(dxr) / 220, 0.55, 1.5);
          projs.push({
            type: "bomb", x: bx - 7, y: by, w: 14, h: 14,
            vx: dxr / tf, vy: -0.5 * g * tf, grav: g, life: 3.4,
            friendly: false, dmg: 1, rot: 0, spin: 6, fuse: 0.42, noDeflect: true,
          });
          A.throwS();
        }
      } else if (e.state === "rec") {
        e.vx *= 0.8;
        if (e.t > 0.6) { e.state = "walk"; e.t = 0; }
      }
    } else if (e.type === "wraith") {
      if (e.state === "idle") {
        e.x = e.homeX - e.w / 2 + Math.sin(e.anim * 1.3 + e.phase) * 14;
        e.y = e.homeY + Math.sin(e.anim * 2 + e.phase) * 8;
        if (seeP && e.cd <= 0) { e.state = "dive"; e.t = 0; e.tx = pcx; e.ty = p.y + 6; e.cd = 2.4; }
      } else if (e.state === "dive") {
        const ang = Math.atan2(e.ty - (e.y + e.h / 2), e.tx - (e.x + e.w / 2));
        const sp = 340;
        e.x += Math.cos(ang) * sp * dt; e.y += Math.sin(ang) * sp * dt;
        if (Math.random() < 0.6) part({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: rnd(-20, 20), vy: rnd(-20, 20), g: -30, life: 0.4, max: 0.4, r: rnd(2, 4), color: "#a05ce0", t: "dot", fade: 1 });
        if (aabb(e, p)) damagePlayer(1, e.x + e.w / 2);
        if (e.t > 0.72 || (groundTopAt(e.x + e.w / 2) !== null && e.y + e.h > groundTopAt(e.x + e.w / 2) - 6)) { e.state = "rise"; e.t = 0; }
      } else if (e.state === "rise") {
        e.y -= 190 * dt;
        if (e.y < e.homeY) { e.y = e.homeY; e.state = "idle"; e.t = 0; }
      }
      continue;
    }

    if (!e.fly) { e.vy += CFG.gravity * dt; e.vy = Math.min(e.vy, CFG.maxFall); moveCollide(e, dt); }
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead && enemies[i].deathT > 0.9) enemies.splice(i, 1);
}

/* ---------------------------------------------------- boss: the giant oni --
   The last land breaks the rule: its arena holds TWIN HORRORS (boss + boss2),
   two brand-new monsters seen nowhere else — a venom centipede that hugs the
   floor and a lantern moth that owns the air — fought together in the dark,

let bossUid = 1;

  { name: "OOMUKADE", hp: 24, scale: 1.0, sub: "THE VENOM CENTIPEDE", kind: "mukade" },

function twinActive() { return !!(boss && boss2 && (!boss.dead || !boss2.dead)); }
/* the whole last land lies in darkness (never the endless night) */
function isDarkLevel() { return !isEndless() && !!curLevel() && curLevel().gate === "final"; }

function bossDef() { return (curLevel() && curLevel().boss) || BOSS_DEF_FALLBACK; }

    pal: (kind && TWIN_PAL[kind]) || null,
    x: x - w / 2, y: GROUND_BASE - h, w, h, vx: 0, vy: 0, onGround: true, wall: 0,
    facing: -1, hp: def.hp, maxHp: def.hp, phase: 1, scale: sc, name: def.name, sub: def.sub || "",

function bossVuln(b) {

function sealWall(x, w) {

function bossSlam(bb) {

function killBoss(b, dir) {

/* A boss weapon is never salvageable. Instead of falling as a pickup, the

  if (state === "sensei") {
    if (hitStop > 0) hitStop -= dt; else updateSensei(dt);
    shake = Math.max(0, shake - dt * 42);
    frameNo++;
    return;
  }
  if (state === "play" || state === "over") {
    if (state === "over") overT += dt;
    if (state === "play" && !P.dead) { game.levelTime += dt; SAVE.stats.time = (SAVE.stats.time || 0) + dt; }
    if (AUTO && state === "play" && !P.dead) autoDrive(dt);
    if (state === "play" && bossIntro > 0) bossIntro = Math.max(0, bossIntro - dt);
    if (hitStop > 0) hitStop -= dt;
    else {
      const sdt = (state === "play" && bossIntro > 2.05) ? dt * 0.28 : dt;
      acc += sdt;
      let steps = 0;
      while (acc >= STEP && steps < 4) { stepWorld(STEP); acc -= STEP; steps++; }
      if (steps >= 4) acc = 0;
    }
    if (!P.dead) updateCam(dt);
    genAhead();
    cullWorld();
    checkLevelProgress();
  }
  shake = Math.max(0, shake - dt * 42);
  frameNo++;
}

/* ----------------------------------------------------------------- inputs -- */
/* ---------------------------------------------------------------- render -- */
let W = 0, H = 0, S = 1, VW = 0, dpr = 1, ZOOM = 1;
/* Landscape safe-area for notched phones. `env(safe-area-inset-*)` is only
   non-zero when the viewport opts into `viewport-fit=cover`, so we set that on
   the meta tag and read the four insets off a hidden probe element. Everything
   in layoutUI()/drawUI() is offset by these, so with no notch (all zeros) every
   calculation is bit-for-bit what it was before. */
let SAFE = { t: 0, r: 0, b: 0, l: 0 };
let safeProbe = null;
function ensureSafeProbe() {
  const m = document.querySelector('meta[name="viewport"]');
  if (m && !/viewport-fit/.test(m.getAttribute("content") || "")) {
    try { m.setAttribute("content", (m.getAttribute("content") || "width=device-width, initial-scale=1") + ", viewport-fit=cover"); } catch (e) { }
  }
  if (!safeProbe) {
    safeProbe = document.createElement("div");
    safeProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
    document.body.appendChild(safeProbe);
  }
}
function readSafeArea() {
  ensureSafeProbe();
  const cs = getComputedStyle(safeProbe);
  SAFE = {
    t: parseFloat(cs.paddingTop) || 0,
    r: parseFloat(cs.paddingRight) || 0,
    b: parseFloat(cs.paddingBottom) || 0,
    l: parseFloat(cs.paddingLeft) || 0,
  };
}
function resize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  readSafeArea();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cw; H = ch;
  cv.width = Math.max(1, Math.floor(cw * dpr));
  cv.height = Math.max(1, Math.floor(ch * dpr));
  VH = (VIEW_H / ZOOM) * Math.pow(Math.max(200, ch) / 400, 0.45);
  S = ch / VH;
  VW = cw / S;
  layoutUI();
  buildSky();
  rotEl.classList.toggle("on", ch > cw * 1.02);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"].forEach(ev =>
  document.addEventListener(ev, () => setTimeout(resize, 120)));

let skyGrad = null;
function buildSky() {
  skyGrad = ctx.createLinearGradient(0, 0, 0, VH);
  skyGrad.addColorStop(0, PAL.sky0);
  skyGrad.addColorStop(0.40, PAL.sky1);
  skyGrad.addColorStop(0.66, PAL.sky2);
  skyGrad.addColorStop(0.85, PAL.sky3);
  skyGrad.addColorStop(1, PAL.sky4);
}
function worldT(px, py) {
  ctx.setTransform(dpr * S, 0, 0, dpr * S, (-cam.x * px * S + shx) * dpr, (-cam.y * py * S + shy) * dpr);
}
function mod(a, n) { return ((a % n) + n) % n; }
/* re-tint the whole backdrop in one multiply + one additive pass */
function themeTint() {
  if (!PAL.mul && !PAL.add) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (PAL.mul) {
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = PAL.mul; ctx.fillRect(0, 0, W, H);
  }
  if (PAL.add) {
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = PAL.add; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = "source-over";
}
/* ambient weather, drawn in screen space so it never costs world fill */
function drawWeather() {
  const fx = PAL.fx;
  if (!fx || !SAVE.set.parts) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = now;
  if (fx === "snow") {
    for (let i = 0; i < 58; i++) {
      const h1 = hash(i * 12.9), h2 = hash(i * 78.2), h3 = hash(i * 39.4);
      const x = mod(h1 * W * 1.7 - cam.x * S * 0.16 * (0.5 + h2) + Math.sin(t * 0.8 + i) * 16, W * 1.7) - W * 0.35;
      const y = mod(h2 * H + t * (16 + h3 * 26), H * 1.12) - H * 0.06;
      ctx.globalAlpha = 0.3 + h3 * 0.55;
      ctx.fillStyle = "#f2f8ff";
      ctx.beginPath(); ctx.arc(x, y, 0.9 + h3 * 1.9, 0, TAU); ctx.fill();
    }
  } else if (fx === "ember") {
    for (let i = 0; i < 44; i++) {
      const h1 = hash(i * 21.3), h2 = hash(i * 55.1), h3 = hash(i * 91.7);
      const spd = 26 + h3 * 46;
      const x = mod(h1 * W * 1.6 - cam.x * S * 0.14 * (0.5 + h2) + Math.sin(t * 0.5 + i) * 22, W * 1.6) - W * 0.3;
      const y = H - mod(h2 * H + t * spd, H * 1.25) + H * 0.08;
      ctx.globalAlpha = (0.25 + h3 * 0.6) * (0.6 + 0.4 * Math.sin(t * 5 + i * 2));
      ctx.fillStyle = h3 > 0.6 ? "#ffd08a" : "#ff7b34";
      ctx.fillRect(x, y, 1.6 + h2 * 1.6, 1.6 + h2 * 1.6);
    }
  } else if (fx === "ash") {
    for (let i = 0; i < 34; i++) {
      const h1 = hash(i * 17.7), h2 = hash(i * 63.9), h3 = hash(i * 8.31);
      const x = mod(h1 * W * 1.8 - cam.x * S * 0.12 * (0.4 + h2) + Math.sin(t * 0.35 + i) * 30, W * 1.8) - W * 0.4;
      const y = mod(h2 * H + t * (10 + h3 * 14), H * 1.15) - H * 0.07;
      ctx.globalAlpha = 0.2 + h3 * 0.35;
      ctx.fillStyle = PAL.fxCol || "rgba(255,180,160,0.5)";
      ctx.beginPath(); ctx.arc(x, y, 1 + h3 * 1.4, 0, TAU); ctx.fill();
    }
  } else {
    /* petals — the default sakura drift */
    for (let i = 0; i < 26; i++) {
      const h1 = hash(i * 7.13), h2 = hash(i * 43.7), h3 = hash(i * 29.3);
      const x = mod(h1 * W * 1.7 - cam.x * S * 0.2 * (0.4 + h2) + Math.sin(t * 0.55 + i) * 34, W * 1.7) - W * 0.35;
      const y = mod(h2 * H + t * (14 + h3 * 20), H * 1.12) - H * 0.06;
      ctx.globalAlpha = 0.28 + h3 * 0.4;
      ctx.fillStyle = "#ffc2d6";
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (0.7 + h3) + i);
      ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.3, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawSky() {
  worldT(0, 0.04);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-20, -20, VW + 40, VH + 40);
  /* stars */
  const TILE = 1500;
  const i0 = Math.floor(cam.x * 0.04 / TILE) - 1, i1 = Math.floor((cam.x * 0.04 + VW) / TILE) + 1;
  for (let i = i0; i <= i1; i++) {
    for (let k = 0; k < 22; k++) {
      const h1 = hash(i * 37.2 + k * 7.13), h2 = hash(i * 91.7 + k * 3.71);
      const x = i * TILE + h1 * TILE;
      const y = h2 * VH * 0.72;
      const tw = 0.45 + 0.55 * Math.sin(now * 1.6 + k * 2.1 + i);
      ctx.globalAlpha = 0.34 + tw * 0.55;
      ctx.fillStyle = h1 > 0.9 ? PAL.starA : PAL.starB;
      const s = h1 > 0.94 ? 2 : 1.2;
      ctx.fillRect(x, y, s, s);
    }
  }
  ctx.globalAlpha = 1;
  /* moon */
  const mx = cam.x * 0.04 + VW * 0.72, my = 82;
  const g = ctx.createRadialGradient(mx, my, 6, mx, my, 130);
  g.addColorStop(0, "rgba(226,236,255,0.34)");
  g.addColorStop(0.35, "rgba(170,200,255,0.10)");
  g.addColorStop(1, "rgba(120,160,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 130, 0, TAU); ctx.fill();
  ctx.fillStyle = PAL.moon; ctx.beginPath(); ctx.arc(mx, my, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = PAL.moonDark;
  ctx.beginPath(); ctx.arc(mx - 9, my - 6, 5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 8, my + 5, 7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 2, my - 12, 3, 0, TAU); ctx.fill();
}

function drawMountains() {
  const par = 0.13;
  worldT(par, 0.24);
  const base = 330 + cam.y * (par - 0.24) * 0;
  const i0 = Math.floor(cam.x * par / 220) - 1, i1 = Math.floor((cam.x * par + VW) / 220) + 1;
  ctx.fillStyle = PAL.mtn;
  ctx.beginPath();
  ctx.moveTo(i0 * 220, 460);
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 3.77), h2 = hash(i * 8.19);
    const x = i * 220, y = 300 - h1 * 80 - h2 * 25;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(i1 * 220 + 220, 460);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PAL.mtnRim; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 3.77), h2 = hash(i * 8.19);
    const x = i * 220, y = 300 - h1 * 80 - h2 * 25;
    if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = PAL.mtnFace;
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 3.77), h2 = hash(i * 8.19);
    const x = i * 220, y = 300 - h1 * 80 - h2 * 25;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 60, y + 130); ctx.lineTo(x + 20, y + 120); ctx.closePath(); ctx.fill();
  }
}

function drawForest() {
  const par = 0.34;
  worldT(par, 0.4);
  const i0 = Math.floor(cam.x * par / 130) - 1, i1 = Math.floor((cam.x * par + VW) / 130) + 1;
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 5.31), h2 = hash(i * 9.77);
    const x = i * 130 + h1 * 80;
    const y = 288 + h2 * 35;
    const hh = 74 + h1 * 70;
    const wdt = 9 + h2 * 10;
    ctx.fillStyle = PAL.forest;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + wdt, y - hh);
    ctx.lineTo(x + wdt * 0.5, y - hh - 18);
    ctx.lineTo(x - wdt * 0.2, y - hh * 0.9);
    ctx.lineTo(x - wdt, y - hh * 0.3);
    ctx.closePath(); ctx.fill();
    for (let b = 0; b < 3; b++) {
      const by = y - hh * (0.42 + b * 0.2);
      const dir = ((i + b) % 2) ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.quadraticCurveTo(x + dir * 42, by - 14, x + dir * 68, by - 2);
      ctx.quadraticCurveTo(x + dir * 40, by - 4, x, by + 5);
      ctx.fill();
    }
  }
}

function drawNearHills() {
  const par = 0.62;
  worldT(par, 0.78);
  const base = 292;
  const x0 = cam.x * par - 60, x1 = cam.x * par + VW + 60;
  const hy = x => base - Math.sin(x * 0.0062) * 19 - Math.sin(x * 0.0143 + 1.4) * 9;
  ctx.fillStyle = PAL.hills;
  ctx.beginPath();
  ctx.moveTo(x0, base + 240);
  for (let x = x0; x <= x1; x += 14) ctx.lineTo(x, hy(x));
  ctx.lineTo(x1, base + 240);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PAL.mtnRim; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 14) { if (x === x0) ctx.moveTo(x, hy(x)); else ctx.lineTo(x, hy(x)); }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.pine;
  const t0 = Math.floor(x0 / 78) - 1, t1 = Math.floor(x1 / 78) + 1;
  for (let i = t0; i <= t1; i++) {
    const h = hash(i * 4.7);
    if (h > 0.5) continue;
    const tx = i * 78 + h * 40;
    const ty = hy(tx);
    const th = 15 + h * 22;
    ctx.beginPath();
    ctx.moveTo(tx - 5, ty); ctx.lineTo(tx, ty - th); ctx.lineTo(tx + 5, ty);
    ctx.closePath(); ctx.fill();
  }
}

function drawGround() {
  worldT(1, 1);
  const x0 = cam.x - 80, x1 = cam.x + VW + 80;
  /* frozen chasms — the drop under the ice bridge has to read as a void */
  for (const c of chasms) {
    if (c.x1 < x0 || c.x0 > x1) continue;
    const g = ctx.createLinearGradient(0, c.top, 0, c.top + 300);
    g.addColorStop(0, "rgba(9,15,26,0.62)");
    g.addColorStop(0.45, "rgba(3,6,12,0.92)");
    g.addColorStop(1, "rgba(0,0,0,1)");
    ctx.fillStyle = g;
    ctx.fillRect(c.x0, c.top - 2, c.x1 - c.x0, 306);
    /* torn ice lips where the crust broke away */
    ctx.fillStyle = "rgba(180,216,242,0.55)";
    ctx.fillRect(c.x0 - 5, c.top - 2, 5, 22);
    ctx.fillRect(c.x1, c.top - 2, 5, 22);
    ctx.fillStyle = "rgba(122,166,208,0.35)";
    ctx.fillRect(c.x0 - 5, c.top + 20, 10, 3);
    ctx.fillRect(c.x1 - 5, c.top + 20, 10, 3);
  }
  /* the ice bridge — one shelf cut into segments, cracking as you cross it */
  for (const s of solids) {
    if (!s.ice || s.x + s.w < x0 || s.x > x1) continue;
    const k = s.shake > 0 ? 1 - s.shake / CFG.iceSlabDelay : 0;
    ctx.save();
    if (k > 0) ctx.translate((Math.random() - 0.5) * 2.4, 0);
    ctx.fillStyle = PAL.ice0;
    ctx.fillRect(s.x, s.y, s.w, 18);
    ctx.fillStyle = PAL.ice1;
    ctx.fillRect(s.x, s.y, s.w, 3);
    ctx.fillStyle = PAL.ice2;
    ctx.fillRect(s.x, s.y + 13, s.w, 5);
    ctx.strokeStyle = "rgba(90,130,175,0.45)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(s.x, s.y + 3); ctx.lineTo(s.x, s.y + 18); ctx.stroke();
    if (k > 0.02) {
      ctx.strokeStyle = `rgba(255,255,255,${0.15 + 0.7 * k})`; ctx.lineWidth = 1.2;
      const c0 = s.x + s.w * (0.3 + 0.4 * hash(s.seed));
      ctx.beginPath(); ctx.moveTo(c0, s.y); ctx.lineTo(c0 - 6, s.y + 7 + 5 * k); ctx.lineTo(c0 + 5, s.y + 18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x + 4, s.y + 3); ctx.lineTo(s.x + s.w * 0.5, s.y + 12); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.fillStyle = PAL.ground;
  for (const s of solids) {
    if (s.spikes || s.oneWay || s.seal || s.ice || s.x + s.w < x0 || s.x > x1) continue;
    ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 320));
  }
  for (const s of solids) {
    if (s.spikes || s.oneWay || s.seal || s.ice || s.x + s.w < x0 || s.x > x1) continue;
    ctx.fillStyle = PAL.gTop;
    ctx.fillRect(s.x, s.y, s.w, 8);
    ctx.fillStyle = PAL.gMid;
    ctx.fillRect(s.x, s.y + 8, s.w, 26);
    ctx.fillStyle = PAL.gFar;
    ctx.fillRect(s.x, s.y + 34, s.w, 70);
    ctx.fillStyle = PAL.gRim;
    ctx.fillRect(s.x, s.y, s.w, 1.3);
  }
  ctx.fillStyle = PAL.spike;
  for (const s of solids) {
    if (!s.spikes || s.x + s.w < x0 || s.x > x1) continue;
    const n = Math.floor(s.w / 15);
    for (let i = 0; i < n; i++) {
      const x = s.x + i * 15 + 7.5;
      ctx.beginPath();
      ctx.moveTo(x - 7.5, s.y + s.h);
      ctx.lineTo(x, s.y - 4);
      ctx.lineTo(x + 7.5, s.y + s.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL.spikeLit;
      ctx.beginPath(); ctx.moveTo(x, s.y - 4); ctx.lineTo(x + 3, s.y + s.h); ctx.lineTo(x + 1, s.y + s.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL.spike;
    }
  }
  /* one-way platforms (wooden planks on `crumble` ones give way) */
  for (const s of solids) {
    if (!s.oneWay || s.x + s.w < x0 || s.x > x1) continue;
    if (s.crumble) {
      const k = s.shake > 0 ? 1 - s.shake / CFG.crumbleDelay : 0;
      ctx.save();
      if (k > 0) ctx.translate((Math.random() - 0.5) * 2.8, 0);
      ctx.fillStyle = "#3a2c1e";
      ctx.fillRect(s.x, s.y, s.w, 12);
      ctx.fillStyle = "#5a4429";
      ctx.fillRect(s.x, s.y, s.w, 3.5);
      ctx.fillStyle = "rgba(150,190,225,0.26)";
      ctx.fillRect(s.x, s.y, s.w, 1.2);
      ctx.fillStyle = "rgba(16,11,6,0.5)";
      for (let i = 1; i < 5; i++) ctx.fillRect(s.x + (i / 5) * s.w - 0.7, s.y + 1, 1.4, 11);
      if (k > 0.02) {
        ctx.strokeStyle = `rgba(8,6,3,${0.3 + 0.55 * k})`; ctx.lineWidth = 1.2;
        const cx0 = s.x + s.w * (0.35 + 0.3 * hash(s.seed));
        ctx.beginPath();
        ctx.moveTo(cx0, s.y);
        ctx.lineTo(cx0 - 5, s.y + 5 + 3 * k);
        ctx.lineTo(cx0 + 4, s.y + 12);
        ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    ctx.fillStyle = PAL.gPlat;
    ctx.fillRect(s.x, s.y, s.w, 12);
    ctx.fillStyle = PAL.gPlatRim;
    ctx.fillRect(s.x, s.y, s.w, 1.5);
    ctx.fillStyle = PAL.gPlatMid;
    ctx.fillRect(s.x, s.y + 1.5, s.w, 5);
  }
  /* arena seals */
  for (const s of solids) {
    if (!s.seal || s.x + s.w < x0 || s.x > x1) continue;
    const g = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
    g.addColorStop(0, "rgba(150,110,255,0.10)");
    g.addColorStop(0.5, "rgba(195,155,255,0.44)");
    g.addColorStop(1, "rgba(150,110,255,0.10)");
    ctx.fillStyle = g;
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = "rgba(225,205,255,0.75)";
    ctx.fillRect(s.x, s.y, s.w, 3);
    ctx.fillStyle = "rgba(235,220,255,0.5)";
    for (let i = 0; i < 6; i++) {
      const ry = s.y + 24 + ((now * 44 + i * 78) % (s.h - 40));
      ctx.fillRect(s.x + 4, ry, s.w - 8, 2);
    }
    ctx.strokeStyle = "rgba(205,175,255,0.55)"; ctx.lineWidth = 1.4;
    ctx.strokeRect(s.x, s.y, s.w, s.h);
  }
  /* pillars */
  for (const s of solids) {
    if (!s.pillar || s.x + s.w < x0 || s.x > x1) continue;
    ctx.fillStyle = PAL.gPillar;
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = PAL.gPillarTop;
    ctx.fillRect(s.x, s.y, s.w, 6);
    ctx.fillStyle = PAL.gPillarRim;
    ctx.fillRect(s.x, s.y, s.w, 1.4);
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    ctx.fillRect(s.x + 4, s.y + 8, 3, Math.max(0, s.h - 26));
  }
}

/* --------------------------------------------------------------- water -- */
/* the flooded paddies: a translucent body that rides the terrace, drawn under
   the entities, plus a surface pass over them so a wading ninja reads as
   half-submerged. The piranhas lurk between the two passes, so they stay hidden
   until the moment they lunge. */
function drawWater() {
  if (!water.length) return;
  worldT(1, 1);
  const xa = cam.x - 40, xb = cam.x + VW + 40;
  for (const w of water) {
    const x0 = Math.max(w.x0, xa), x1 = Math.min(w.x1, xb);
    if (x1 - x0 < 2) continue;
    const col = [];
    for (let x = x0; x <= x1; x += 14) col.push([x, waterTopAt(x)]);
    col.push([x1, waterTopAt(x1)]);
    ctx.beginPath();
    ctx.moveTo(col[0][0], col[0][1]);
    for (let i = 1; i < col.length; i++) ctx.lineTo(col[i][0], col[i][1]);
    for (let i = col.length - 1; i >= 0; i--) ctx.lineTo(col[i][0], col[i][1] + CFG.paddyDepth);
    ctx.closePath();
    ctx.fillStyle = PAL.water0; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = PAL.water1;
    for (const c of col) ctx.fillRect(c[0] - 8, c[1] + 5, 16, 9);
    ctx.globalAlpha = 0.9;

function limb(x1, y1, x2, y2, w, col) {

function seg(x, y, a, l) { return { x: x + Math.sin(a) * l, y: y + Math.cos(a) * l }; }
const C_BODY = "#151d31", C_DARK = "#080b15", C_MID = "#1d2a45", SCARF = "#e0454a", BLADE = "#e6f4ff";

function drawScarf(p, cx, fy) {
  const pts = p.scarf;
  if (pts.length < 2) return;
  const w0 = 6, w1 = 1.3;
  const W = i => lerp(w0, w1, i / (pts.length - 1)) * 0.5;
  ctx.fillStyle = SCARF;
  ctx.beginPath();
  const n1 = pts.length - 1;
  const fwd = clamp(p.vx * p.facing, -400, 400);
  const trail = -Math.min(Math.max(fwd * 0.17, 0), 30);
  const lift = Math.min(Math.max(fwd * 0.09, 0), 16);
  for (let pass = 0; pass < 2; pass++) {
    const sgn = pass === 0 ? 1 : -1;
    for (let k = 0; k < pts.length; k++) {
      const i = pass === 0 ? k : pts.length - 1 - k;
      const q = pts[i];
      const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, n1)];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dl = Math.hypot(dx, dy) || 1;
      const nx = -dy / dl * sgn * W(i), ny = dx / dl * sgn * W(i);
      const t = i / n1;
      const px = (q.x - cx) * p.facing + trail * t;
      const py = q.y - fy - lift * t * t;
      if (pass === 0 && k === 0) ctx.moveTo(px + nx, py + ny);
      else ctx.lineTo(px + nx, py + ny);
    }
  }
  ctx.closePath();
  ctx.fill();
}
